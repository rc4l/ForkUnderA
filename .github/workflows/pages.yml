name: Deploy commit-tracker to Pages

# Publishes commit-tracker/ (the coverage viewer + its TSV data) as a static site.
on:
  push:
    branches: [main]
    paths:
      - commit-tracker/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; don't cancel an in-progress publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # [rc4l] Main-repo-only infra: publishing to GitHub Pages needs Pages enabled + the github-pages
    # environment, which a fork does not have, so configure-pages/deploy-pages just fail there. Skip on
    # forks; only rc4l/ZandroX publishes the commit-tracker site.
    if: github.repository == 'rc4l/ZandroX'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload commit-tracker as the site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: commit-tracker
      - id: deployment
        uses: actions/deploy-pages@v4
