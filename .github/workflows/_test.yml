# [rc4l] Reusable C++ test job called by test-and-build.yml and release.yml so the same suite gates both.
name: tests (reusable)

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # [rc4l] Full history (not the default shallow depth-1): commit-tracker-check.sh verifies
      # every ported/adapted row's provenance sha exists as a commit, which needs full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # [rc4l] Linux fully supports AddressSanitizer/UBSan/LeakSanitizer, unlike macOS.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang clang-tidy llvm

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S tests -B build-tests -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DZANDROX_TESTS_SANITIZE=ON

      - name: Build
        run: cmake --build build-tests

      # [rc4l] ZScript tripwire: fail the build if VM/ZScript symbols enter compiled engine code
      # (policy: docs/zscript-insulation.md). A machine checks, not a person.
      - name: ZScript tripwire
        run: bash tools/zscript-tripwire.sh

      # [rc4l] Calls to APIs a staircase flight removed (born from the gluPerspective slip:
      # dependency removal is only as strict as the loosest platform unless a machine checks).
      - name: Removed-API tripwire
        run: bash tools/removed-api-tripwire.sh

      # [rc4l] A .ps1 with non-ASCII bytes and no UTF-8 BOM fails to PARSE under Windows PowerShell
      # 5.1 (the default shell on a stock Windows box) because it decodes as ANSI. CI cannot notice
      # on its own -- our workflows run `shell: pwsh`, which reads UTF-8 regardless -- so this only
      # ever breaks a contributor locally. Both Windows build scripts shipped broken this way.
      - name: PowerShell encoding tripwire
        run: bash tools/powershell-encoding-tripwire.sh

      # [rc4l] The repo carries two independent tag namespaces (v* for the game, server-registry-v*
      # for the container image). A bare `git describe --tags` takes whichever is nearest, so tagging
      # an image silently renamed every later game build -- visible only in the window title, and it
      # also made the update check think 0.0.0 was running and never stop offering an update.
      - name: Version tag tripwire
        run: bash tools/version-tag-tripwire.sh

      # [rc4l] The FF-parity tripwire retired with its subject at the GL 2.x removal
      # (staircase flight 13a): there is no fixed-function branch left to diverge from.

      # [rc4l] Commit tracker: coverage.tsv stays machine-parseable (5 fields, 40-hex sha,
      # valid status vocab) and every ported/adapted row's provenance commit must exist.
      - name: Commit tracker check
        run: bash tools/commit-tracker-check.sh

      # [rc4l] crash-sync reopen rule: it reopened closed crash issues forever (#79, #85) because it
      # treated "still unresolved in GlitchTip" as "the crash recurred". Pure, stdlib-only, no
      # network — a machine checks the rule, not a person.
      - name: crash-sync regression rule
        run: python3 tools/crash_sync_test.py

      # [rc4l] Wire-format snapshot: the client/server protocol is Zandronum's (protocolspec/*.txt).
      # A backport that changes a command's fields/order/id -- or inserts a command, shifting every
      # later id -- silently desyncs multiplayer while single-player builds fine. This derives the
      # protocol signature from the generator's OWN parser and fails if it drifts from the committed
      # golden. To ACCEPT an intentional change: tools/protocol-snapshot.py --write (and confirm
      # older clients still parse it). Pure Python, no build needed.
      - name: Protocol wire-format snapshot
        run: python3 tools/protocol-snapshot.py --check

      # [rc4l] The command SHAPE is pinned above; this pins the VALUES of enums carried
      # inside those commands. SERVERCOMMANDS_DoCeiling and friends send a sector-mover
      # type as an integer, so renumbering the enum changes what an unchanged command
      # means -- invisible to the snapshot above, and it breaks savegames too. Upstream
      # cannot hit this (peer-to-peer, no SERVERCOMMANDS) and renumbers freely, so the
      # check has to live on our side. Pure Python, no build needed.
      - name: Wire-carried enum snapshot
        run: python3 tools/wire-enum-snapshot.py --check

      # [rc4l] detect_leaks=1 turns on LeakSanitizer, which is supported here on Linux.
      - name: Run tests (ASan + UBSan + LeakSanitizer)
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-tests --output-on-failure

      # [rc4l] Enforce 100% line coverage on every tested unit — --auto derives the list from
      # each *_test.cpp's sibling, so new tests are gated automatically with no edit here.
      - name: Coverage (100% gate on tested units)
        run: bash tests/coverage.sh --auto

      # [rc4l] clang-tidy moved to _tidy.yml, run by the callers as a parallel job. It was 438s
      # of this job's 588s, and every platform build `needs: test` — so a report-only lint
      # (WarningsAsErrors is empty; any parse error it could hit already fails the Build step
      # above) was gating 7+ minutes of every PR's critical path. Same files, same config, same
      # parallelism — just off the path the builds wait on. (It cannot live as a second job in
      # THIS file: a caller's `needs: test` waits on the whole called workflow — fine for the
      # seconds-long test-macos job below, fatal for a 7-minute lint.)

  # [rc4l] macOS ASan job. Its irreplaceable purpose is the Objective-C updater networking seam
  # (i_system_cocoa_net_test.mm), which guards the Mac_HttpsGet use-after-free — the Linux `test` job
  # above can't compile Cocoa code. It ALSO runs the full portable suite (via ctest, which discovers
  # every target): those tests are pure C++ and already run on Linux, but a second run under Apple
  # clang catches any macOS-specific compiler/ASan quirk in the helpers. This is free insurance — on a
  # public repo the macOS runner costs nothing, and the job runs in PARALLEL with `test` (no `needs:`),
  # finishing well inside the Linux job's window, so it adds ~0 to the gate's wall-clock. LeakSanitizer
  # is intentionally absent: macOS AddressSanitizer does not support detect_leaks (it aborts).
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # [rc4l] cmake and the Xcode clang toolchain are preinstalled on GitHub macOS runners.
      - name: Configure (ASan + UBSan)
        run: cmake -S tests -B build-tests -DZANDROX_TESTS_SANITIZE=ON

      - name: Build
        run: cmake --build build-tests

      - name: Run tests (ASan + UBSan)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-tests --output-on-failure

  # [rc4l] MSVC job. Its purpose is PORTABILITY, not coverage: the assertions here already run on
  # Linux, and the sanitizer/coverage options are GCC/Clang-only by design. What only this job can
  # catch is the test project failing to CONFIGURE OR COMPILE under MSVC -- which is exactly what had
  # happened, silently, for as long as the tests existed.
  #
  # Windows had a BUILD job (_build.yml) but never a TEST one, so nothing ever pointed cl.exe at
  # tests/CMakeLists.txt. Five separate breakages accumulated behind that gap -- __int128 in four test
  # files, M_PI without _USE_MATH_DEFINES, -Wextra passed to cl (D8021, a hard error), a
  # strnicmp=strncasecmp remap that is backwards on Windows, and missing ws2_32 -- each individually
  # trivial, together enough that `ctest` had never once run on Windows. Fixing them without adding
  # this job would just restart the clock.
  #
  # No `needs:`, so it runs in PARALLEL with test/test-macos and adds ~nothing to the gate's
  # wall-clock: the suite itself takes about 5 seconds; the MSVC configure and the GoogleTest fetch
  # are the cost.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # [rc4l] cmake and the MSVC toolchain are preinstalled on GitHub Windows runners. No sanitizer
      # flags: ZANDROX_TESTS_SANITIZE wires GCC/Clang-style -fsanitize options that cl does not take.
      - name: Configure (MSVC)
        run: cmake -S tests -B build-tests

      - name: Build
        run: cmake --build build-tests --config Release

      # [rc4l] --config matters here: MSVC is a multi-config generator, and without it ctest looks in
      # the wrong directory and reports every test as NOT_BUILT rather than failing outright.
      - name: Run tests
        run: ctest --test-dir build-tests -C Release --output-on-failure
