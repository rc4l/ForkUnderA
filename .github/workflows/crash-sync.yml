# [rc4l] Mirrors GlitchTip crash groups into GitHub issues so all triage lives on GitHub, and
# symbolicates the native stack IN-LINE (GlitchTip can't symbolicate C/C++). Each issue is filed
# already titled at the crash site with the full, readable stack (crash site first) in its body --
# no "<unknown>" then rename, no waiting on a follow-up comment. If symbols can't be resolved the
# issue is still filed, with the raw stack and a note explaining why. See tools/crash_sync.py.
# (This supersedes the droplet symbolicator cron in zandrox-crash-infra.)
#
# Triggering is event-driven: a GlitchTip alert fires a webhook -> a relay adds GitHub auth and
# sends a `repository_dispatch` (type `glitchtip-crash`) -> this job runs within seconds of a real
# crash. The schedule is a slow safety-net only (was every 15 min, ~96 no-op runs/day).
name: crash-sync

on:
  workflow_dispatch:
  repository_dispatch:
    types: [glitchtip-crash]   # fired by the GlitchTip-alert -> relay path (event-driven, instant)
  schedule:
    - cron: "0 */6 * * *"      # safety net only; the webhook is the primary path

permissions:
  issues: write     # file/label crash issues
  contents: read    # read releases (to download the build's symbols) + checkout

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GLITCHTIP_URL: ${{ secrets.GLITCHTIP_URL }}
      GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
      GLITCHTIP_ORG: ${{ secrets.GLITCHTIP_ORG }}
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-symbolizer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends llvm

      - name: Symbolicate GlitchTip crashes into GitHub issues
        run: python3 tools/crash_sync.py
