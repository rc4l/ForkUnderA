# [rc4l] Reusable per-platform build called by test-and-build.yml (on PRs) and release.yml
# (on main and for releases), so a PR builds exactly what a release would ship.
name: build (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string baked into the archive names'
        required: false
        type: string
        default: dev
      upload_symbols:
        description: 'Build with debug info and upload symbols to GlitchTip (release only)'
        required: false
        type: boolean
        default: false

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # [rc4l] On a real release, tag HEAD with the release version BEFORE building so updaterevision's
      # `git describe` bakes the correct version into GIT_DESCRIPTION. Otherwise the tag is created only
      # at publish time (after the build), so the shipped binary self-identifies as the PREVIOUS release
      # and the auto-update check flags an update to itself.
      - name: Bake release version into git describe
        if: inputs.upload_symbols
        shell: bash
        run: git tag -f "${{ inputs.version }}" HEAD

      - name: Build ZandroX
        env:
          ZX_WITH_SYMBOLS: ${{ inputs.upload_symbols && '1' || '0' }}
        run: |
          # Native OpenAL build (no FMOD, no Rosetta) — arm64 on Apple Silicon runners.
          set -o pipefail
          SOUND=1 ./mac_compile.sh 2>&1 | tee build.log
          # [rc4l] Fail if a shipping feature silently didn't compile in (the recurring
          # "works locally, dead in release" class: FFmpeg replay, sentry crash reporting).
          grep -q "FUA replay: FFmpeg found" build.log || { echo "::error::instant replay / FFmpeg not enabled in this build"; exit 1; }
          grep -q "ZX crash reporting: sentry ENABLED" build.log || { echo "::error::sentry crash reporting not enabled in this build"; exit 1; }

      # [rc4l] A silently soundless build has shipped before; refuse to package one.
      - name: Verify sound is linked
        run: |
          set -euo pipefail
          bin=build/ForkUnderA.app/Contents/MacOS/forkundera
          otool -L "$bin" | grep -q libopenal \
            || { echo "::error::$bin is not linked against libopenal — no sound"; exit 1; }
          test -f build/ForkUnderA.app/Contents/MacOS/libopenal.1.dylib \
            || { echo "::error::libopenal is not bundled in the .app"; exit 1; }
          echo "sound OK"; otool -L "$bin" | grep -iE 'openal|sndfile|mpg123'

      # [rc4l] ditto preserves the bundle's permissions and symlinks; upload-artifact's own
      # zipping drops the executable bit and produces an .app macOS refuses to launch.
      - name: Package ForkUnderA.app
        run: |
          set -euo pipefail
          mkdir -p dist-macos
          ditto -c -k --sequesterRsrc --keepParent \
            build/ForkUnderA.app "dist-macos/ForkUnderA-${{ inputs.version }}-macos-arm64.zip"
          ls -la dist-macos/

      - name: Upload ForkUnderA.app
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ZandroX-macos
          path: dist-macos/*.zip

      - name: Package debug symbols (dSYM)
        if: ${{ inputs.upload_symbols }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD | cut -c1-12)
          ( cd build && zip -qry "../symbols-macos-${sha}.zip" forkundera.dSYM )
          ls -la symbols-macos-*.zip

      - name: Upload symbols artifact
        if: ${{ inputs.upload_symbols }}
        uses: actions/upload-artifact@v4
        with:
          name: symbols-macos
          path: symbols-macos-*.zip

  build-linux:
    # [rc4l] Build natively on the jammy runner, NOT via Dockerfile.linux-build. The Docker path
    # rebuilt its image every run, and a from-scratch apt-get against public Ubuntu mirrors took
    # ~36 min of a ~40 min job (the compile itself is ~3 min). The runner is already Ubuntu 22.04
    # (jammy, glibc 2.35) — the exact target the Docker base gave us — so a native build keeps the
    # same wide-distro glibc compatibility while apt resolves in seconds off the runner's mirror.
    # Docker (Dockerfile.linux-build / package-linux.sh) stays in the repo for local macOS->Linux
    # cross-builds; CI just doesn't need it. Pin 22.04 (not ubuntu-latest) so the glibc floor is
    # explicit and can't drift up when the "latest" label moves to a newer release.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Bake release version into git describe
        if: inputs.upload_symbols
        shell: bash
        run: git tag -f "${{ inputs.version }}" HEAD

      - name: Build + package ZandroX (Linux, native)
        # [rc4l] linux_compile.sh is the same script devs run; --install-deps apt-installs the
        # build/OpenAL libs, then it configures, builds and packages dist-linux/*.tar.gz itself.
        env:
          VERSION: ${{ inputs.version }}
          ZX_WITH_SYMBOLS: ${{ inputs.upload_symbols && '1' || '0' }}
        run: |
          set -o pipefail
          ./linux_compile.sh --install-deps 2>&1 | tee build.log
          # [rc4l] Fail if a shipping feature silently didn't compile in.
          grep -q "FUA replay: FFmpeg found" build.log || { echo "::error::instant replay / FFmpeg not enabled in this build"; exit 1; }
          grep -q "ZX crash reporting: sentry ENABLED" build.log || { echo "::error::sentry crash reporting not enabled in this build"; exit 1; }
          ls -la dist-linux/

      - name: Package debug symbols (.debug)
        if: ${{ inputs.upload_symbols }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD | cut -c1-12)
          ( cd build-linux && zip -qy "../symbols-linux-${sha}.zip" forkundera.debug )
          ls -la symbols-linux-*.zip

      - name: Upload symbols artifact
        if: ${{ inputs.upload_symbols }}
        uses: actions/upload-artifact@v4
        with:
          name: symbols-linux
          path: symbols-linux-*.zip

      # [rc4l] The headless server, from the same script and the same runner. This is the ONLY place
      # in CI that compiles SERVERONLY, and it compiles genuinely different code (SERVER_ONLY=1, no
      # GL, no sound) -- so without this step a break confined to one of those branches passes every
      # pull request and surfaces only when somebody builds a server image.
      #
      # LAST, AND THE ORDER IS LOAD-BEARING. It reconfigures build-linux/ with SERVERONLY=ON, which
      # renames the target and leaves the client's forkundera.debug stale in a directory that no longer
      # builds it. Running before the symbols steps would have them zip whatever happened to survive
      # the reconfigure, which is the kind of failure that produces an uploaded artifact rather than
      # an error.
      #
      # No --install-deps: the client step already installed them. No ZX_WITH_SYMBOLS either, so this
      # stays a short compile; symbolicating server crashes is worth doing and is its own change.
      - name: Build + package the headless server (Linux, native)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          SERVERONLY=ON ./linux_compile.sh 2>&1 | tee build-server.log
          # [rc4l] Assert the tarball, not a binary name. SERVERONLY appends "-server" to
          # ZDOOM_EXE_NAME, which is a cache variable, so the executable's name is the build system's
          # to choose and not something CI should restate -- doing that in the Dockerfile produced a
          # green compile and an image with nothing in it.
          ls -la dist-linux/
          ls dist-linux/*-server.tar.gz >/dev/null 2>&1 \
            || { echo "::error::serveronly build produced no -server tarball"; exit 1; }

      # [rc4l] Picks up BOTH tarballs: linux_compile.sh suffixes the serveronly one, so the glob that
      # used to match one file now matches two and release.yml attaches both through assets/*.
      - name: Upload ZandroX Linux tarballs
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ZandroX-linux
          path: dist-linux/*.tar.gz

  build-windows:
    # windows-2022 has Visual Studio 2022 (windows-latest moved to VS2026, whose
    # generator name differs and which CMake mis-detects). Matches the reference build.
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Bake release version into git describe
        if: inputs.upload_symbols
        shell: bash
        run: git tag -f "${{ inputs.version }}" HEAD

      # [rc4l] VCPKG_INSTALLATION_ROOT is a runner environment variable, and the env context in
      # an expression only sees workflow-level env: blocks — using it in the cache path below
      # silently yielded "/installed", which cached nothing. Resolve it in a step instead.
      - name: Resolve the vcpkg install path
        id: vcpkg
        shell: pwsh
        run: |
          $p = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed'
          "installed=$p" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "vcpkg installed tree: $p"

      # [rc4l] Building these from source took 15.5 of this job's 19 minutes. Restoring the
      # installed tree makes the vcpkg install inside the script a near-no-op; the key is the
      # build script's hash (the dep list lives there now), so it busts when the deps change.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.installed }}
          key: vcpkg-x64-windows-static-${{ hashFiles('windows_compile.ps1') }}
          restore-keys: vcpkg-x64-windows-static-

      # [rc4l] The whole compile — vcpkg deps, DirectX-SDK reshaping, CMake configure/build and
      # packaging — lives in windows_compile.ps1 so a contributor runs exactly what CI runs, and
      # CI verifies the script on every PR. Keep this a thin wrapper: no build logic here.
      - name: Compile ZandroX (windows_compile.ps1)
        shell: pwsh
        env:
          ZX_WITH_SYMBOLS: ${{ inputs.upload_symbols && '1' || '0' }}
        run: |
          $ErrorActionPreference = "Stop"
          ./windows_compile.ps1 -Version "${{ inputs.version }}" 2>&1 | Tee-Object -FilePath build.log
          # [rc4l] Fail if a shipping feature silently didn't compile in.
          if (-not (Select-String -Path build.log -Pattern "FUA replay: FFmpeg found" -Quiet)) { Write-Error "instant replay / FFmpeg not enabled in this build" }
          if (-not (Select-String -Path build.log -Pattern "ZX crash reporting: sentry ENABLED" -Quiet)) { Write-Error "sentry crash reporting not enabled in this build" }

      - name: Upload ZandroX Windows build
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ZandroX-windows
          path: ForkUnderA-*-windows-x64.zip

      - name: Package debug symbols (PDB)
        if: ${{ inputs.upload_symbols }}
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Substring(0,12)
          $pdb = Get-ChildItem -Path build-win -Recurse -Filter forkundera.pdb | Select-Object -First 1
          if (-not $pdb) { throw "no forkundera.pdb found under build-win" }
          Compress-Archive -Path $pdb.FullName -DestinationPath "symbols-windows-$sha.zip" -Force
          Get-ChildItem symbols-windows-*.zip

      - name: Upload symbols artifact
        if: ${{ inputs.upload_symbols }}
        uses: actions/upload-artifact@v4
        with:
          name: symbols-windows
          path: symbols-windows-*.zip
