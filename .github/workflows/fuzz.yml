# [rc4l] The long fuzzing run, kept off the PR path on purpose: coverage-guided fuzzing pays off
# over hours, not the seconds a PR can afford, so it runs nightly the way continuous fuzzing is
# normally operated. PRs get the bounded property mode from test-and-build.yml instead.
name: Fuzz (nightly)

on:
  schedule:
    # [rc4l] 04:00 UTC, off-peak for the shared runner pool.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Time budget per fuzz test, spent sequentially per target (e.g. 200s, 10m)'
        type: string
        default: '200s'

jobs:
  fuzz:
    uses: ./.github/workflows/_fuzz.yml
    with:
      mode: fuzz
      # [rc4l] --fuzz_for spends the budget on each target in turn, so the run is
      # duration x target count: 200s x 25 lands near 85 minutes, plus the build. Raising this
      # means re-checking that total against the job timeout -- and adding a target raises it too.
      duration: ${{ inputs.duration || '200s' }}
