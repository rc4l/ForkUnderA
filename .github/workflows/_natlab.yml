# [rc4l] Does a player behind one router actually reach a server behind another?

name: NAT lab

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      # [rc4l] Repeat the lab N times on one commit, so a flake rate can be MEASURED rather than
      # argued about -- a single red run says nothing about whether a change helped.
      runs:
        description: "How many times to run each case"
        default: "1"
        required: false

jobs:
  # [rc4l] The engine with the control bridge, built once for every case below rather than once in each.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # [rc4l] CMake takes these as its compiler launcher, so every compile goes through the cache restored below.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4

      # [rc4l] DiligentCore alone, which the client configure requires: sentry-native stays out as before, since it needs libcurl that neither this job nor the peer image has.
      - name: Fetch DiligentCore
        run: git submodule update --init --recursive deps/DiligentCore

      # [rc4l] The peer image's runtime set (tools/natlab/Dockerfile.peer) without FFmpeg, plus the X11, XCB and Wayland headers the Vulkan backend compiles against.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 pkg-config \
            libssl-dev libopus-dev zlib1g-dev libbz2-dev libjpeg-dev \
            libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev libglew-dev libgme-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libwayland-dev \
            libopenal-dev libsndfile1-dev libmpg123-dev

      # [rc4l] Objects compiled by earlier runs of this job, so a run compiles what changed.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: natlab
          max-size: 400M

      # [rc4l] The bridge is what makes the lab assertable, since without it the lab could only watch processes stay alive, which a client that never connected also does.
      - name: Build the engine with the control bridge
        run: ZX_MCP_BRIDGE=1 ZX_KEEP_GOING=1 ./linux_compile.sh --no-package

      # [rc4l] What tools/natlab/run.sh takes from build-linux/: the binary and its pk3s, the IWAD coming from the checkout's tools/freedoom/.
      - name: Upload the engine
        uses: actions/upload-artifact@v4
        with:
          name: natlab-engine
          path: |
            build-linux/forkundera
            build-linux/*.pk3
          if-no-files-found: error
          retention-days: 1

  natlab:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # [rc4l] The permissive host router: its mapping accepts anyone, so the joiner's ordinary
          # challenge already reaches it.
          - host_nat: fullcone
            client_nat: portrestricted
          # The common home router on both ends, and the hard case: whichever packet lands on the far
          # router first takes the tuple the other side's outbound needs. Kept in the matrix because
          # it is where a real improvement would show up.
          - host_nat: portrestricted
            client_nat: portrestricted
          # Carrier-grade / symmetric on the host side. Punching cannot work here and the lab asserts
          # the degradation is clean rather than asserting success -- so a change that makes a failed
          # punch hang the client is caught, which is the failure players would actually feel.
          - host_nat: symmetric
            client_nat: portrestricted
    name: natlab (${{ matrix.host_nat }} <- ${{ matrix.client_nat }})

    steps:
      - uses: actions/checkout@v4

      - name: Download the engine
        uses: actions/download-artifact@v4
        with:
          name: natlab-engine
          path: build-linux

      # [rc4l] An artifact keeps no file modes.
      - name: Make the engine executable
        run: chmod +x build-linux/forkundera

      - name: Run the NAT lab
        run: |
          fails=0
          for i in $(seq 1 ${{ github.event.inputs.runs || 1 }}); do
            echo "::group::run $i"
            tools/natlab/run.sh --host-nat ${{ matrix.host_nat }} --client-nat ${{ matrix.client_nat }} || fails=$((fails+1))
            echo "::endgroup::"
          done
          echo "FLAKE RATE: $fails failures out of ${{ github.event.inputs.runs || 1 }}"
          [ "$fails" = "0" ]

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "See the diagnostics dumped by run.sh above."
          docker ps -a || true

  # [rc4l] Its own job, not a step on the NAT one: dedupe has nothing to do with traversal, and
  # bolting it onto a job that already runs the whole matrix pushed that job past its timeout and got
  # it killed -- which reads as a failed assertion and is not one.
  dualstack:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # [rc4l] On demand only until the fixture is settled. It has failed five times for five unrelated
    # container reasons and not once for the behaviour it checks, and continue-on-error still reports
    # a failing check, so it would block every merge while proving nothing.
    #
    # Run it with: gh workflow run _natlab.yml --ref main
    #
    # Keyed on the workflow NAME, not the event: a called workflow inherits its caller's event, so
    # "workflow_dispatch" was also true inside a dispatched release and let this job fail one.
    if: github.workflow == 'NAT lab'
    name: dualstack (dedupe + v6-only client)

    steps:
      - uses: actions/checkout@v4

      - name: Download the engine
        uses: actions/download-artifact@v4
        with:
          name: natlab-engine
          path: build-linux

      # [rc4l] An artifact keeps no file modes.
      - name: Make the engine executable
        run: chmod +x build-linux/forkundera

      - name: Prove a dual-stack server is one row, and a v6-only client can find it
        run: tools/natlab/run-dualstack.sh
