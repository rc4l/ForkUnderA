# [rc4l] Run the test suite on every push/PR and build all three platforms on PRs and main,
# so platform-specific breakage shows up before merge instead of after.
name: Test & Build

on:
  # [rc4l] Main only, not every branch: a branch with an open PR would otherwise fire both
  # push and pull_request and run the whole workflow twice over the same commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# [rc4l] Cancel a superseded PR run rather than build three platforms for a commit nobody reads.
# Main is excluded because its runs back the badge and the merge history.
concurrency:
  group: test-and-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    uses: ./.github/workflows/_test.yml

  # [rc4l] Deliberately NOT `needs: test`. It builds its own engine and shares nothing with the other
  # jobs, so making it wait would add its runtime to the pipeline instead of hiding it behind the
  # platform builds. It answers the one question nothing else here asks: can two players behind two
  # different routers actually reach each other.
  natlab:
    uses: ./.github/workflows/_natlab.yml

  # [rc4l] A clang-tidy job ran here and gated publish in release.yml. Deleted in 50d64db, which
  # has the measurements. .clang-tidy stays for editors and clangd.

  # [rc4l] PRs and main, but not every feature-branch push — the builds are the slow part.
  # Main is covered as well as PRs because an admin can push straight past the PR gate.
  # Advisory, not a required check: the Windows job depends on vcpkg and a pinned runner
  # image, and a hiccup there shouldn't block a merge that never touched Windows.
  build:
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('main-{0}', github.run_number) }}
