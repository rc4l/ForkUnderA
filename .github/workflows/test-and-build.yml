# [rc4l] Run the test suite on every push/PR and build all three platforms on PRs and main,
# so platform-specific breakage shows up before merge instead of after.
name: Test & Build

on:
  # [rc4l] Main only, not every branch: a branch with an open PR would otherwise fire both
  # push and pull_request and run the whole workflow twice over the same commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/_test.yml

  # [rc4l] A clang-tidy job used to run here, and in release.yml where it gated publish. Deleted
  # after measuring what it actually did:
  #
  #   - 17m53s per run, of which 953s was one clang-tidy invocation. Every other job in the release
  #     finished in 5m35s, so publish sat waiting on it for ~13 minutes.
  #   - The skip-cache never hit. Its key hashed all 1391 files under src/zandronum/src/**, and 678
  #     of those are .cpp files that no test can include, so any engine edit re-linted all 110 test
  #     files for nothing.
  #   - It reported 2196 diagnostics and passed anyway, because WarningsAsErrors was empty. 1308 of
  #     them were literal-suffix casing.
  #   - Every one of those 2196 was inside a *_test.cpp. HeaderFilterRegex '$^' dropped headers and
  #     the file selector only matched tests, so it never saw the engine OR our own compute code.
  #   - Nothing ran it locally, so nobody ever read the output.
  #
  # A lint worth having would point at features/*/computation/*.cpp and put real checks in
  # WarningsAsErrors. That is a different job from this one, so this one goes rather than lingering
  # as something people assume is protecting them. .clang-tidy is deliberately KEPT: editors and
  # clangd read it, which is where these diagnostics are actually useful.

  # [rc4l] PRs and main, but not every feature-branch push — the builds are the slow part.
  # Main is covered as well as PRs because an admin can push straight past the PR gate.
  # Advisory, not a required check: the Windows job depends on vcpkg and a pinned runner
  # image, and a hiccup there shouldn't block a merge that never touched Windows.
  build:
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('main-{0}', github.run_number) }}
