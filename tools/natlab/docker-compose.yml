# [rc4l] The topology, which is the entire fixture.

services:
  registry:
    image: fua-natlab-registry
    build:
      context: ../..
      dockerfile: Dockerfile.registry
    networks:
      pub:
        ipv4_address: 203.0.113.10

  router_host:
    image: fua-natlab-router
    build:
      context: .
      dockerfile: Dockerfile.router
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      NAT_FLAVOUR: ${NAT_FLAVOUR_HOST:-portrestricted}
      # Which side is the internet, by address rather than by interface name -- Docker does not
      # promise that the first network listed becomes eth0.
      NAT_WAN_PREFIX: "203.0.113."
      # Only used by the fullcone flavour, which forwards the game port inward.
      NAT_LAN_PEER: 192.168.241.20
      NAT_GAME_PORT: "10666"
    networks:
      pub:
        ipv4_address: 203.0.113.2
      lan_host:
        ipv4_address: 192.168.241.2

  router_client:
    image: fua-natlab-router
    build:
      context: .
      dockerfile: Dockerfile.router
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      NAT_FLAVOUR: ${NAT_FLAVOUR_CLIENT:-portrestricted}
      NAT_WAN_PREFIX: "203.0.113."
    networks:
      pub:
        ipv4_address: 203.0.113.3
      lan_client:
        ipv4_address: 192.168.242.2

  # [rc4l] The routers sit at .2, not .1.
  host:
    image: fua-natlab-peer
    build:
      context: .
      dockerfile: Dockerfile.peer
    cap_add: [NET_ADMIN]
    depends_on: [router_host, registry]
    environment:
      PEER_GATEWAY: 192.168.241.2
    networks:
      lan_host:
        ipv4_address: 192.168.241.20
    command: ["sleep", "infinity"]

  client:
    image: fua-natlab-peer
    build:
      context: .
      dockerfile: Dockerfile.peer
    cap_add: [NET_ADMIN]
    depends_on: [router_client, registry]
    environment:
      PEER_GATEWAY: 192.168.242.2
    networks:
      lan_client:
        ipv4_address: 192.168.242.20
    command: ["sleep", "infinity"]

# [rc4l] `pub` is 203.0.113.0/24 (TEST-NET-3) and MUST NOT be a private range.
networks:
  pub:
    ipam:
      config: [{ subnet: 203.0.113.0/24 }]
  lan_host:
    internal: true
    ipam:
      config: [{ subnet: 192.168.241.0/24 }]
  lan_client:
    internal: true
    ipam:
      config: [{ subnet: 192.168.242.0/24 }]
