# [rc4l] The topology, which is the entire fixture. Three networks, and the two peers share none of
# them:
#
#     host  --[ lan_host ]--  router_host  --\
#                                             >--[ pub ]--  registry
#     client --[ lan_client ]-- router_client -/
#
# `pub` is the internet. Neither peer is on it. Each reaches it only through its own router, which
# masquerades outbound and drops unsolicited inbound -- so the host is listed and unreachable, which
# is precisely the situation every player behind a home router is in and the situation the punch
# exists to solve.
#
# internal: true on the LANs is load-bearing. Without it Docker attaches its own default bridge with
# a working route to everything, both peers become mutually reachable, and every assertion passes
# while testing nothing. A test that cannot fail is the failure.

services:
  registry:
    image: fua-natlab-registry
    build:
      context: ../..
      dockerfile: Dockerfile.registry
    networks:
      pub:
        ipv4_address: 192.168.240.10

  router_host:
    image: fua-natlab-router
    build:
      context: .
      dockerfile: Dockerfile.router
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      NAT_FLAVOUR: ${NAT_FLAVOUR_HOST:-portrestricted}
    networks:
      pub:
        ipv4_address: 192.168.240.2
      lan_host:
        ipv4_address: 192.168.241.1

  router_client:
    image: fua-natlab-router
    build:
      context: .
      dockerfile: Dockerfile.router
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      NAT_FLAVOUR: ${NAT_FLAVOUR_CLIENT:-portrestricted}
    networks:
      pub:
        ipv4_address: 192.168.240.3
      lan_client:
        ipv4_address: 192.168.242.1

  # [rc4l] The peers get NET_ADMIN only to replace their default route with their router. Compose
  # gives every container a route to its own networks and nothing else useful, so without this the
  # host would have no path to the registry at all and the lab would test a disconnected machine.
  host:
    image: fua-natlab-peer
    build:
      context: .
      dockerfile: Dockerfile.peer
    cap_add: [NET_ADMIN]
    depends_on: [router_host, registry]
    environment:
      PEER_GATEWAY: 192.168.241.1
    networks:
      lan_host:
        ipv4_address: 192.168.241.20
    command: ["sleep", "infinity"]

  client:
    image: fua-natlab-peer
    build:
      context: .
      dockerfile: Dockerfile.peer
    cap_add: [NET_ADMIN]
    depends_on: [router_client, registry]
    environment:
      PEER_GATEWAY: 192.168.242.1
    networks:
      lan_client:
        ipv4_address: 192.168.242.20
    command: ["sleep", "infinity"]

networks:
  pub:
    ipam:
      config: [{ subnet: 192.168.240.0/24 }]
  lan_host:
    internal: true
    ipam:
      config: [{ subnet: 192.168.241.0/24 }]
  lan_client:
    internal: true
    ipam:
      config: [{ subnet: 192.168.242.0/24 }]
