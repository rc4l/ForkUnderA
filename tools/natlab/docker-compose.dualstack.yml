# [rc4l] The dedupe fixture: one server, two families, one row.

services:
  registry:
    image: fua-natlab-registry
    build:
      context: ../..
      dockerfile: Dockerfile.registry
    networks:
      dual:
        ipv4_address: 203.0.113.10
        ipv6_address: fd00:cafe:1::10

  host:
    image: fua-natlab-peer
    build:
      context: .
      dockerfile: Dockerfile.peer
    # Both records under one name. The engine resolves the A itself and asks for the AAAA separately,
    # so a name carrying only one of them produces only one announce and the test would pass by
    # accident with nothing to group.
    extra_hosts:
      - "registry.natlab:203.0.113.10"
      - "registry.natlab:fd00:cafe:1::10"
    networks:
      dual:
        ipv4_address: 203.0.113.20
        ipv6_address: fd00:cafe:1::20
    command: ["sleep", "infinity"]

  client:
    image: fua-natlab-peer
    build:
      context: .
      dockerfile: Dockerfile.peer
    # [rc4l] Only so the v6-only case can remove this container's own IPv4 address.
    cap_add: [NET_ADMIN]
    extra_hosts:
      - "registry.natlab:203.0.113.10"
      - "registry.natlab:fd00:cafe:1::10"
    networks:
      dual:
        ipv4_address: 203.0.113.30
        ipv6_address: fd00:cafe:1::30
    command: ["sleep", "infinity"]

  # [rc4l] A client that never had an IPv4 address, rather than one we amputate at runtime: taking an
  # address off a running container breaks it underneath the exec sessions already using it, which
  # hangs rather than fails.
  client6:
    image: fua-natlab-peer
    build:
      context: .
      dockerfile: Dockerfile.peer
    extra_hosts:
      - "registry.natlab:fd00:cafe:1::10"
    networks:
      v6only:
        ipv6_address: fd00:cafe:2::30
    command: ["sleep", "infinity"]

networks:
  dual:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 203.0.113.0/24
        - subnet: fd00:cafe:1::/64
  # [rc4l] IPv6 only, which is the whole point: a client here cannot fall back to IPv4 because there
  # is no IPv4 to fall back to.
  v6only:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:cafe:2::/64
