<title>Snapshot Module Map</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a toolbar over a scrolling board of layer columns, with a details panel docked right (a bottom sheet on phones). */
:root {
  --bg: #e9ece7;
  --board: #f1f3ef;
  --surface: #fbfcfa;
  --surface-2: #f3f5f1;
  --ink: #18211d;
  --muted: #5b6862;
  --faint: #8a958f;
  --rule: #cdd4ce;
  --edge: #9aa69f;
  --out: #0a7a6d;
  --out-soft: #d5ece8;
  --in: #b75917;
  --in-soft: #f6e2d2;
  --hook: #7d6a1f;
  --hook-soft: #efe7c8;
  --l-server: #3263a3;
  --l-format: #4b5b67;
  --l-client: #7a52a8;
  --l-world: #4b7a36;
  --l-tools: #a2456a;
  --l-compute: #1f7a99;
  --l-engine: #7d6a1f;
  --shadow: 0 1px 2px rgba(24,33,29,.06), 0 2px 8px rgba(24,33,29,.05);
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --board: #151b18; --surface: #1c2420; --surface-2: #212a26;
  --ink: #e4ebe6; --muted: #9eaba4; --faint: #6f7c75; --rule: #2e3833; --edge: #4f5d56;
  --out: #3cc4b0; --out-soft: #173a35; --in: #f0955a; --in-soft: #45291a;
  --hook: #d3b955; --hook-soft: #3a3318;
  --l-server: #77a3e0; --l-format: #9fb0bd; --l-client: #b994e6; --l-world: #8cc06f; --l-tools: #e486ab; --l-compute: #5cc0de; --l-engine: #d3b955;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111614; --board: #151b18; --surface: #1c2420; --surface-2: #212a26;
  --ink: #e4ebe6; --muted: #9eaba4; --faint: #6f7c75; --rule: #2e3833; --edge: #4f5d56;
  --out: #3cc4b0; --out-soft: #173a35; --in: #f0955a; --in-soft: #45291a;
  --hook: #d3b955; --hook-soft: #3a3318;
  --l-server: #77a3e0; --l-format: #9fb0bd; --l-client: #b994e6; --l-world: #8cc06f; --l-tools: #e486ab; --l-compute: #5cc0de; --l-engine: #d3b955;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--out); outline-offset: 2px; }
code, .mono { font-family: var(--f-code); }

/* ---- toolbar ---- */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding-block: 12px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule); background: var(--surface);
}
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; font-stretch: 85%; letter-spacing: .01em; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
.brand p code { font-size: 11.5px; }
.search { position: relative; flex: 1 1 240px; max-width: 360px; min-width: 0; }
.search input {
  width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--surface-2); color: var(--ink); font: 13px var(--f-code);
}
.results {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30; margin: 0; padding: 4px; list-style: none;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow);
  max-height: 320px; overflow: auto;
}
.results li { padding: 6px 8px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.results li[aria-selected="true"], .results li:hover { background: var(--surface-2); }
.results .r-name { font-family: var(--f-code); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .r-file { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 6px 10px; cursor: pointer;
  font-size: 12.5px; font-weight: 500;
}
.btn:hover { background: var(--surface-2); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid; }
.lg-out { color: var(--out); } .lg-in { color: var(--in); } .lg-hook { color: var(--hook); } .lg-ptr { color: var(--muted); }
.lg-ptr i { border-top-style: dashed; }

/* ---- main ---- */
.main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
.main.no-panel { grid-template-columns: 1fr 0; }
.viewport { overflow: auto; min-width: 0; min-height: 0; background: var(--board); position: relative; }
.board {
  position: relative; display: flex; align-items: flex-start; gap: 72px;
  padding: 22px max(28px, env(safe-area-inset-left, 0px)) 80px; width: max-content;
}
svg.edges { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 1; }
.col { width: 284px; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 2; }
.col[hidden] { display: none !important; }
.col-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 0 2px; min-height: 30px; }
.col-head b { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 650; color: var(--muted); }
.col-head small { color: var(--faint); font-size: 11.5px; }
.layer-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--lc); flex: none; align-self: center; }

.ent {
  --lc: var(--l-format);
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow);
  transition: opacity .15s, border-color .15s, box-shadow .15s;
}
.ent[data-layer="server"] { --lc: var(--l-server); }
.ent[data-layer="client"] { --lc: var(--l-client); }
.ent[data-layer="world"] { --lc: var(--l-world); }
.ent[data-layer="tools"] { --lc: var(--l-tools); }
.ent[data-layer="compute"] { --lc: var(--l-compute); }
.ent[data-layer="engine"] { --lc: var(--l-engine); }
.ent-head {
  display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 8px; align-items: center; width: 100%;
  background: none; border: 0; padding: 10px 12px 9px; text-align: left; cursor: pointer; border-radius: 8px;
}
.ent-head:hover { background: var(--surface-2); }
.chev { width: 0; height: 0; border-left: 5px solid var(--muted); border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; justify-self: center; }
.ent.open .chev { transform: rotate(90deg); }
.fname { font-family: var(--f-code); font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ent[data-layer="engine"] .fname { font-weight: 400; font-size: 12.5px; }
.ftag { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--lc); font-weight: 650; display: inline-flex; align-items: center; gap: 5px; }
.ftag::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--lc); }
.fmeta { grid-column: 2 / 4; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.fmeta code { font-size: 11px; }
.ent-body { border-top: 1px solid var(--rule); padding: 4px 0 6px; }
.sec { padding: 6px 12px 2px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 650; display: flex; justify-content: space-between; }
.fn {
  display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; border: 0; background: none;
  padding: 3px 12px 3px 14px; text-align: left; cursor: pointer; border-left: 3px solid transparent; min-height: 23px;
}
.fn:hover { background: var(--surface-2); }
.fn .n { font-family: var(--f-code); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fn .k { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.deg { display: inline-flex; gap: 6px; font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.more { display: block; width: calc(100% - 24px); margin: 6px 12px 2px; padding: 5px 8px; border: 1px dashed var(--rule); background: none; border-radius: 5px; color: var(--muted); font-size: 12px; cursor: pointer; text-align: left; }
.more:hover { background: var(--surface-2); }

/* focus states */
.board.focusing .ent:not(.e-active):not(.e-rel) { opacity: .38; }
.ent.e-active { border-color: var(--ink); }
.ent.e-rel-out { border-color: var(--out); }
.ent.e-rel-in { border-color: var(--in); }
.ent.e-rel-hook { border-color: var(--hook); }
.ent .relcount { font-size: 10.5px; font-weight: 600; border-radius: 4px; padding: 1px 5px; display: none; white-space: nowrap; }
.ent.e-rel .relcount { display: inline-block; }
.relcount.o { background: var(--out-soft); color: var(--out); }
.relcount.i { background: var(--in-soft); color: var(--in); }
.relcount.h { background: var(--hook-soft); color: var(--hook); }
.fn.f-active { background: var(--surface-2); border-left-color: var(--ink); }
.fn.f-active .n { font-weight: 600; }
.fn.f-out { background: var(--out-soft); border-left-color: var(--out); }
.fn.f-in { background: var(--in-soft); border-left-color: var(--in); }
.fn.f-hook { background: var(--hook-soft); border-left-color: var(--hook); }
.fn.f-sel::after { content: "pinned"; font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--surface); background: var(--ink); border-radius: 3px; padding: 1px 4px; }

path.e-base { fill: none; stroke: var(--edge); opacity: .55; }
.board.focusing path.e-base { opacity: .12; }
path.e-base.hl-out { stroke: var(--out); opacity: .9; }
path.e-base.hl-in { stroke: var(--in); opacity: .9; }
path.e-base.hl-hook { stroke: var(--hook); opacity: .9; }
path.e-fn { fill: none; stroke-width: 1.6; }
path.e-fn.out { stroke: var(--out); }
path.e-fn.in { stroke: var(--in); }
path.e-fn.hook { stroke: var(--hook); }
path.e-fn.ptr { stroke-dasharray: 5 4; }
marker path { stroke: none; }
#m-base path { fill: var(--edge); } #m-out path { fill: var(--out); } #m-in path { fill: var(--in); } #m-hook path { fill: var(--hook); }
.elabel rect { fill: var(--surface); stroke: var(--rule); }
.elabel text { font: 600 10.5px var(--f-ui); fill: var(--ink); }

/* ---- panel ---- */
.panel { border-left: 1px solid var(--rule); background: var(--surface); overflow: auto; min-width: 0; min-height: 0; }
.main.no-panel .panel { display: none; }
.p-inner { padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 14px; }
.p-state { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 650; }
.p-state .pin { text-transform: none; letter-spacing: 0; font-weight: 500; }
.p-name { font-family: var(--f-code); font-size: 16px; font-weight: 600; word-break: break-all; margin: 0; }
.p-where { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.p-where code { font-size: 12px; }
.p-sig { font-family: var(--f-code); font-size: 12px; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
.p-sum { line-height: 1.55; font-size: 13.5px; max-width: 62ch; }
.p-sum p { margin: 0 0 8px; }
.p-src { font-size: 11.5px; color: var(--faint); }
.p-h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 650; display: flex; align-items: center; gap: 8px; margin: 0; }
.p-h.o { color: var(--out); } .p-h.i { color: var(--in); } .p-h.h { color: var(--hook); } .p-h.n { color: var(--muted); }
.p-h .cnt { font-variant-numeric: tabular-nums; color: var(--faint); }
.grp { display: flex; flex-direction: column; gap: 1px; }
.grp-f { font-family: var(--f-code); font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.grp-f.same { font-style: italic; }
.lnk { background: none; border: 0; padding: 2px 0 2px 10px; text-align: left; cursor: pointer; font-family: var(--f-code); font-size: 12.5px; color: var(--ink); border-left: 2px solid var(--rule); }
.lnk:hover { border-left-color: var(--ink); text-decoration: underline; }
.lnk.ptr::after { content: " (as a pointer)"; color: var(--faint); font-family: var(--f-ui); font-size: 11px; }
.hookrow { padding: 2px 0 2px 10px; border-left: 2px solid var(--hook-soft); font-size: 12.5px; }
.hookrow code { font-size: 12px; }
.hookrow small { color: var(--faint); }
.p-empty { color: var(--muted); line-height: 1.55; font-size: 13.5px; }
.p-empty ul { padding-left: 18px; margin: 8px 0; }
.p-empty li { margin: 4px 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }
.stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
.relrow { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.relrow .lnk { flex: 1; }
.relrow small { color: var(--faint); font-variant-numeric: tabular-nums; }
.p-actions { display: flex; flex-wrap: wrap; gap: 6px; }

@media (max-width: 860px) {
  .main, .main.no-panel { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .panel { border-left: 0; border-top: 1px solid var(--rule); max-height: 44vh; }
  .p-inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .legend, .brand p { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="bar">
  <div class="brand">
    <h1>Snapshot Module Map</h1>
    <p id="tagline"></p>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Find a function or file" autocomplete="off" aria-label="Find a function or file" aria-controls="results">
    <ul class="results" id="results" role="listbox" hidden></ul>
  </div>
  <div class="tools">
    <button class="btn" id="expandAll" type="button">Expand all</button>
    <button class="btn" id="collapseAll" type="button">Collapse all</button>
    <button class="btn" id="engineBtn" type="button" aria-pressed="false">Engine hooks</button>
    <button class="btn" id="panelBtn" type="button" aria-pressed="true">Details</button>
  </div>
  <div class="legend" aria-label="Legend">
    <span class="lg-out"><i></i>calls</span>
    <span class="lg-in"><i></i>called by</span>
    <span class="lg-hook"><i></i>engine hook</span>
    <span class="lg-ptr"><i></i>passed as a pointer</span>
  </div>
</header>

<div class="main" id="main">
  <div class="viewport" id="viewport">
    <div class="board" id="board">
      <svg class="edges" id="edges" aria-hidden="true">
        <defs>
          <marker id="m-base" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z"/></marker>
          <marker id="m-out" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z"/></marker>
          <marker id="m-in" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z"/></marker>
          <marker id="m-hook" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z"/></marker>
        </defs>
        <g id="g-base"></g><g id="g-fn"></g><g id="g-lab"></g>
      </svg>
    </div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"><div class="p-inner" id="pin"></div></aside>
</div>

<script type="application/json" id="data">@MODMAP_DATA@</script>
<script>
(function () {
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const F = D.funcs, E = D.entities, ENG = D.engine;
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/* ---------- model ---------- */
const byName = {};
for (const k in F) if (F[k].k === "function") byName[F[k].n] = k;
const outs = {}, ins = {}, hooksIn = {};
for (const k in F) { outs[k] = []; ins[k] = ins[k] || []; }
for (const k in F) {
  const f = F[k];
  const add = (n, ptr) => { const t = byName[n]; if (!t || t === k) return; outs[k].push({ t, ptr }); (ins[t] = ins[t] || []).push({ t: k, ptr }); };
  f.c.forEach(n => add(n, false)); f.r.forEach(n => add(n, true));
}
// engine entities: one per stock file; its rows are the stock functions that call in
const engKeys = {};   // "eng:file|caller" -> {file, caller, targets:{key:[lines]}}
for (const file in ENG) {
  for (const caller in ENG[file].callers) {
    const key = "eng:" + file + "|" + caller, tg = {};
    for (const n in ENG[file].callers[caller]) {
      const t = byName[n]; if (!t) continue;
      tg[t] = ENG[file].callers[caller][n];
      (hooksIn[t] = hooksIn[t] || []).push({ file, caller, lines: tg[t], key });
    }
    engKeys[key] = { file, caller, targets: tg };
  }
}
const isEng = k => k.startsWith("eng:");
const entOf = k => isEng(k) ? "eng:" + engKeys[k].file : F[k].e;
const cross = (k, list) => list.filter(x => entOf(x.t) !== entOf(k));

// entity -> entity weights (calls between functions), plus engine file -> entity
const pair = {};
const bump = (a, b, n) => { if (a === b) return; const id = a + "\u0000" + b; pair[id] = (pair[id] || 0) + n; };
for (const k in F) for (const o of outs[k]) bump(F[k].e, F[o.t].e, 1);
for (const key in engKeys) for (const t in engKeys[key].targets) bump("eng:" + engKeys[key].file, F[t].e, 1);

const COLS = [
  { id: "engine", title: "Engine", note: "files outside the module that call in", layer: "engine" },
  ...D.cols
];
const engFiles = Object.keys(ENG).sort((a, b) => Object.keys(ENG[b].callers).length - Object.keys(ENG[a].callers).length || a.localeCompare(b));
COLS[0].ents = engFiles.map(f => "eng:" + f);

/* ---------- state ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("fmm:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("fmm:" + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
};
const S = {
  open: new Set(store.get("open", D.open)),
  more: new Set(),
  engine: store.get("engine", false),
  panel: store.get("panel", true),
  hover: null, sel: null
};

/* ---------- render ---------- */
const board = $("#board"), svg = $("#edges"), gBase = $("#g-base"), gFn = $("#g-fn"), gLab = $("#g-lab");
const entEls = {}, rowEls = {};

function fnSections(e) {
  const keys = Object.keys(F).filter(k => F[k].e === e);
  const hooked = [], cmds = [], crossing = [], inner = [];
  for (const k of keys) {
    const f = F[k];
    if (f.k !== "function") cmds.push(k);
    else if (hooksIn[k]) hooked.push(k);
    else if (cross(k, outs[k]).length || cross(k, ins[k]).length) crossing.push(k);
    else inner.push(k);
  }
  const by = (a, b) => F[a].n.localeCompare(F[b].n);
  return [
    ["Called by the engine", hooked.sort(by)],
    ["Console commands and entry points", cmds.sort(by)],

    ["Public, used only in this file", inner.sort(by), true]

  if (head) {
    const id = head.dataset.head;
    if (S.open.has(id)) S.open.delete(id); else S.open.add(id);
    saveOpen(); rerenderEnt(id);
    entEls[id].querySelector(".ent-head").focus({ preventScroll: true });
    select("ent:" + id, { keep: true });
    return;
  }
  const more = ev.target.closest("[data-more]");
  if (more) { S.more.add(more.dataset.more); rerenderEnt(more.dataset.more); return; }
  const row = ev.target.closest(".fn");
  if (row) select(row.dataset.k);
});
board.addEventListener("pointerover", ev => {
  const row = ev.target.closest(".fn");
  if (row) return setHover(row.dataset.k);
  const head = ev.target.closest("[data-head]");
  if (head) return setHover("ent:" + head.dataset.head);
});
board.addEventListener("pointerleave", () => setHover(null));
board.addEventListener("pointerout", ev => {
  if (!ev.relatedTarget || !board.contains(ev.relatedTarget)) return;
  if (!ev.relatedTarget.closest(".fn,[data-head]")) setHover(null);
});
board.addEventListener("focusin", ev => {
  const row = ev.target.closest(".fn"); if (row) return setHover(row.dataset.k);
  const head = ev.target.closest("[data-head]"); if (head) setHover("ent:" + head.dataset.head);
});
board.addEventListener("focusout", ev => { if (!board.contains(ev.relatedTarget)) setHover(null); });

$("#panel").addEventListener("click", ev => {
  const go = ev.target.closest("[data-go]");
  if (go) { const k = go.dataset.go; reveal(k); select(k, { keep: true }); return; }
  const ge = ev.target.closest("[data-goent]");
  if (ge) { const id = ge.dataset.goent; reveal("ent:" + id); select("ent:" + id, { keep: true }); return; }
  if (ev.target.closest("#unpin")) { S.sel = null; S.hover = null; applyFocus(); return; }
  if (ev.target.closest("#openRel")) {
    const R = related(S.hover || S.sel);
    for (const id of [...Object.keys(R.ents.out), ...Object.keys(R.ents.in), ...(S.engine ? Object.keys(R.ents.hook) : [])]) if (entEls[id] && !S.open.has(id)) { S.open.add(id); renderEnt(id); }
    saveOpen(); applyFocus();
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && document.activeElement !== $("#q")) { S.sel = null; S.hover = null; applyFocus(); }
});
$("#expandAll").addEventListener("click", () => { for (const c of COLS) if (c.id !== "engine" || S.engine) c.ents.forEach(id => S.open.add(id)); saveOpen(); renderAll(); });
$("#collapseAll").addEventListener("click", () => { S.open.clear(); S.more.clear(); saveOpen(); renderAll(); });
$("#engineBtn").addEventListener("click", () => setEngine(!S.engine));
$("#panelBtn").addEventListener("click", () => {
  S.panel = !S.panel; store.set("panel", S.panel);
  $("#panelBtn").setAttribute("aria-pressed", S.panel);
  $("#main").classList.toggle("no-panel", !S.panel);
  requestAnimationFrame(drawEdges);
});

/* ---------- search ---------- */
const q = $("#q"), res = $("#results");
const index = [
  ...Object.keys(F).map(k => ({ k, name: F[k].n, file: F[k].e, kind: F[k].k })),
  ...Object.keys(E).map(id => ({ k: "ent:" + id, name: id, file: "file", kind: "file" })),
  ...Object.keys(engKeys).map(k => ({ k, name: engKeys[k].caller, file: engKeys[k].file, kind: "engine" }))
];
let hits = [], hi = 0;
function search() {
  const s = q.value.trim().toLowerCase();
  if (!s) { res.hidden = true; return; }
  hits = index.filter(x => x.name.toLowerCase().includes(s))
    .sort((a, b) => (a.name.toLowerCase().indexOf(s) - b.name.toLowerCase().indexOf(s)) || a.name.length - b.name.length).slice(0, 14);
  hi = 0;
  res.innerHTML = hits.length ? hits.map((x, i) => `<li role="option" data-i="${i}" aria-selected="${i === hi}"><span class="r-name">${esc(x.name)}</span><span class="r-file">${esc(x.kind === "file" ? "file" : x.file)}</span></li>`).join("") : `<li aria-disabled="true"><span class="r-file">No function or file matches.</span></li>`;
  res.hidden = false;
}
function choose(i) {
  const x = hits[i]; if (!x) return;
  res.hidden = true; q.blur();
  reveal(x.k); select(x.k, { keep: true });
}
q.addEventListener("input", search);
q.addEventListener("keydown", ev => {
  if (res.hidden) return;
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault(); hi = (hi + (ev.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length;
    res.querySelectorAll("li").forEach((li, i) => li.setAttribute("aria-selected", i === hi));
  } else if (ev.key === "Enter") { ev.preventDefault(); choose(hi); }
  else if (ev.key === "Escape") { res.hidden = true; }
});
res.addEventListener("mousedown", ev => { const li = ev.target.closest("li[data-i]"); if (li) { ev.preventDefault(); choose(+li.dataset.i); } });
q.addEventListener("blur", () => setTimeout(() => { res.hidden = true; }, 120));

/* ---------- boot ---------- */
$("#tagline").innerHTML = `Every source file of <code>features/net-snapshot</code> and its tools at <code>${esc(D.tag)}</code>, the functions and commands each declares, and the calls between them.`;
$("#engineBtn").setAttribute("aria-pressed", S.engine);
$("#panelBtn").setAttribute("aria-pressed", S.panel);
$("#main").classList.toggle("no-panel", !S.panel);
renderAll();
let raf = 0;
const redraw = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); };
if (window.ResizeObserver) new ResizeObserver(redraw).observe(board);
window.addEventListener("resize", redraw);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
})();
</script>
