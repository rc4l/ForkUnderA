// Zero Invasion: three lives each. The same waves, with a reason to be careful.

invasion true
cooperative true

// The one line that separates this from the invasion beside it.
sv_maxlives 3

// Players are not fighting each other here, so the deathmatch flags do not apply.
dmflags 0
dmflags2 0

Compat_SkulltagJumping true

compatflags 0
compatflags2 0
zadmflags 0
zacompatflags 0

// No rotation on purpose. The pack's own mapinfo runs the three tiers into each other and loops back.
sv_randommaprotation 0
