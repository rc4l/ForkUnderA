// Bosses from Hell: cooperative. One boss per map, picked from a hub rather than played in order.

// [rc4l] NO map rotation here, and this is the one entry where that is not a preference.
//
// Every map is in cluster 94, which the pack declares as a hub, and defaultmap sends anything that
// ends to HUB. So finishing a boss returns you to Earth to choose the next one, and HELL loops back
// to itself. A server rotation would advance the map on exit instead, which is not a different
// running order: it is the pack's whole structure taken away.
sv_randommaprotation 0

cooperative 1
deathmatch 0
survival false

// Ultra-Violence.
skill 3

sv_noautoaim false
sv_bfgfreeaim true

// Fixes BFG tracers attacking friendly targets.
sv_smartaim 2

// Players will not collide with each other.
sv_unblockplayers true

teamdamage 0.00

// Required by the pack.
sv_maxlives 0
sv_nojump false
sv_itemrespawn true
sv_respawnsuper false
sv_weaponstay true
sv_doubleammo true
sv_coop_loseammo true
sv_coop_loseweapons false
sv_awarddamageinsteadkills true

sv_sharekeys true
sv_allowfreelook true

// [rc4l] Deliberately NOT in the "required by the pack" block above, where it used to sit as false.
// Every cooperative experience here forbids dropping; if this pack turns out to want it, this is
// the one line to put back rather than the group to reconsider.
sv_nodrop true

// The hub is how you choose a boss, so a vote that moved the map would be voting to leave it.
sv_nomapvote true
sv_nochangemapvote true
sv_nopointlimitvote true
sv_notimelimitvote true
sv_nofraglimitvote true
