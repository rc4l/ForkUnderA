// Who Dun It? Survival: one of you is not what they say they are.

survival true

// [rc4l] Taken from a running Who Dun It? server, less the chasecam: third person is a cheat, and a
// worse one in a mode about not knowing who is behind you.
sv_weaponstay true
sv_itemrespawn true
sv_allowfreelook true
sv_coop_loseinventory true
sv_coop_losekeys true
sv_coop_loseweapons true
sv_coop_losearmor true
sv_coop_losepowerups true
sv_coop_loseammo true
sv_bfgfreeaim true
sv_noautomapallies true
sv_disallowspying true
sv_disallowsuicide true
sv_noidentifytarget true
sv_applylmsspectatorsettings true
sv_nocoopinfo true
sv_forcevideodefaults true
compat_limited_airmovement true
compat_nocrosshair true
compat_nogravity_spheres true

skill 3

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// On, at full. The mode turns on being able to hurt each other, so a server that swallowed the damage
// would have taken the game with it.
sv_teamdamage 1

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// The rotation, in the pack's own order: the numbered maps with the three EX maps and the secret one
// where they fall.
addmap WDI01
addmap WDI02
addmap WDI03
addmap WDI04
addmap WDI05
addmap WDI06
addmap WDI07
addmap WDI08
addmap WDI09
addmap WDIEX01
addmap WDI10
addmap WDI11
addmap WDI12
addmap WDI13
addmap WDI14
addmap WDIEX02
addmap WDI15
addmap WDI16
addmap WDI17
addmap WDI18
addmap WDI19
addmap WDIEX03
addmap WDI20
addmap WDI21
addmap WDI22
addmap WDI23
addmap WDI24
addmap WDIAB02
addmap WDIEXSEC
