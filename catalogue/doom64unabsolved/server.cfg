// Doom64: Unabsolved. Deathmatch, on the four maps the conversion ships.
//
// [rc4l] They are named DM01 to DM04 and the pack's own mapinfo titles them after the mappers who
// built them, so deathmatch is what they were made for. There are no others in either file.

deathmatch 1

// The Eon Collection's numbers, which are the house deathmatch settings.
sv_weaponstay true
sv_forcerespawn true
sv_noexit true
sv_nomonsters true
sv_itemrespawn true
sv_allowjump true
sv_nocrouch true
sv_barrelrespawn true
sv_norespawninvul true
sv_disallowsuicide true
sv_norunes true
sv_nomedals true
sv_nodrop true
compat_limited_airmovement true
compat_instantrespawn true
compat_disabletaunts true
compat_clientssendfullbuttoninfo true
compat_oldrandom true
compat_oldzdoomzmovement true
compat_fullweaponlower true

sv_forcerespawntime 4
timelimit 10
fraglimit 25
skill 4

sv_allowfreelook true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// All four. The pack chains DM01 to DM04 and back, so this only says the same thing where a server
// can act on it.
addmap DM01
addmap DM02
addmap DM03
addmap DM04
