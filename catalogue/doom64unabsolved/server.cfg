// Doom64: Unabsolved. Cooperative, on the four maps the conversion ships.

cooperative 1
deathmatch 0
survival false

// [rc4l] No rotation. The pack's own mapinfo chains DM01 to DM04 and loops back, so the order is
// already stated where the maps are, and the entry opens on DM01.
sv_randommaprotation 0

// [rc4l] Nothing exotic set here on purpose. No settings came with this one, and the conversion does
// its own weapons and monsters in DECORATE rather than through server flags.
dmflags 0
dmflags2 0
compatflags 0
compatflags2 0
zadmflags 0
zacompatflags 0

sv_maxlives 0
sv_itemrespawn true
sv_weaponstay true