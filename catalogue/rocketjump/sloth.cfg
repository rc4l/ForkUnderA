// Rocket Jumping Playlist: Rocket Jump Sloth. Three maps.
//
// [rc4l] Every way of playing here runs on these same settings and differs only in its rotation.
// Kept as a cfg each rather than one shared file because that is what the schema hands the server,
// and a jump map that ever needs its own answer should be able to give one without disturbing the
// rest. If you change something above the rotation, change it in all of them.

cooperative 1
deathmatch 0
survival false

// [rc4l] The whole point. A rocket jump is a rocket you are standing on, and running dry ends the
// map for you until somebody exits it.
sv_infiniteammo true
sv_weaponstay true

// [rc4l] Skulltag's jump physics, which is what these maps were built and timed against. Every jump
// in them clears its gap under those numbers and a fair few do not under anybody else's.
Compat_SkulltagJumping true
sv_allowjump true

// No crouching, which none of these need and several would be broken by.
sv_nocrouch true
sv_allowfreelook true

// Ultra-Violence, for the handful of these maps that have anything in them to shoot.
skill 3

// [rc4l] No double ammo. It is the catalogue's default for anything below Nightmare and it means
// nothing here: the ammo is already infinite.

sv_unblockplayers true
sv_sharekeys true
sv_nodrop true
sv_disallowsuicide false

// Instant respawn. Missing a jump is the ordinary way to die here and waiting is not the lesson.
compat_instantrespawn true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

// [rc4l] IN ORDER. These are playlists: they open easy and get harder, and a shuffle drops somebody
// onto the last map of a set they have not learned the first of.
sv_randommaprotation 0

// [rc4l] Three, and not the three anybody would guess. The wad carries MAP02, MAP06 and
// MAP10 and nothing else, so a rotation counted from one would send the server to maps that
// are not in it.
addmap MAP02
addmap MAP06
addmap MAP10
