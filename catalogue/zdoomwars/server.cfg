// ZDoom Wars I: last man standing, one life a round.
//
// [rc4l] Decoded from the numbers a running server reports -- dmflags 1610612992, dmflags2 6291456,
// zadmflags 48, zacompatflags 2 -- and written out by name. Three of those bits are not here and
// each is said below, because a bit dropped in silence looks the same as a bit missed.

lastmanstanding true

// One life. There is no unlimited in LMS: GAMEMODE_GetMaxLives reads a zero as one anyway.
sv_maxlives 1

// Rounds won, not frags. No clock at all: a round ends when one side is wiped out, and a summoner
// who has spent everything can take twenty minutes to lose.
winlimit 3
timelimit 0

// Ultra-Violence, which is the only difficulty the pack documents. Not Nightmare: every monster on
// the field was paid for in mana, and doubling their speed would reprice the whole roster.
skill 3

// No sv_doubleammo. Nothing here is picked up -- weapons and monsters are bought with mana -- so
// doubling ammo pickups would double nothing and read as an oversight later.

// Players walk through each other. Two summoners and forty of their monsters share a corridor, and
// bodies blocking bodies is how a push stalls on its own front rank.
sv_unblockplayers true

sv_forcerespawn true
sv_disallowsuicide true
sv_nomedals true

// The mod's menus read the full button state and cannot work from the buttons a client sends by
// default.
compat_clientssendfullbuttoninfo true

// Not set, though the server reports them: sv_coop_loseammo and sv_coop_halveammo are cooperative
// flags and do nothing in LMS, and sv_chasecam is third person, which this catalogue does not ship
// anywhere.

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

// Shuffled, as an arena pack rather than a campaign: the maps do not get harder in order.
sv_randommaprotation 1

// The forty-five ZDWARS maps, read from ZDoomWarsIMapsv1.8d.pk3. The eight ZDW5CP maps in that
// file are left out on purpose: they are the same arenas rebuilt around control points, they chain
// only to each other in the pack's own mapinfo, and under LMS the points do nothing.
addmap ZDWARS1
addmap ZDWARS2
addmap ZDWARS3
addmap ZDWARS4
addmap ZDWARS5
addmap ZDWARS6
addmap ZDWARS7
addmap ZDWARS8
addmap ZDWARS9
