// Mega Man 8-bit Deathmatch: deathmatch on its own game, with its own weapons.
// The json says which FILES to load; this says which MAPS to play and how.
// No sv_hostname here: the host's own name wins.

deathmatch true

// [rc4l] Written out from the flag words the reference server runs, one named cvar each.
//
// A number in a config is unreadable and unreviewable: nobody can tell what 540804 turns on, and a
// wrong bit is invisible in review. The names cost more lines and are worth it. Two bits from that
// server are deliberately NOT here, because this engine has no constant for either and setting the
// raw number would have quietly asked for nothing. See the commit for which.

// A weapon stays on the floor after someone takes it, and items come back.
sv_weaponstay true
sv_itemrespawn true

// Spawn as far from the others as the map allows.
sv_spawnfarthest true

// Mouselook, which this game is built around: its weapons are aimed.
sv_allowfreelook true

// The BFG-alike is free-aimed rather than snapped to a target.
sv_bfgfreeaim true

// [rc4l] The team half of the settings, which do nothing until somebody moves the TEAMS slider off
// zero, and are what makes it worth having: allies do not block, do not absorb your shots, cannot be
// shoved, and share what they pick up.
sv_unblockallies true
sv_shootthroughallies true
sv_dontpushallies true
sv_sharekeys true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

// [rc4l] IN ORDER, which here is the games' own order rather than anything alphabetical: the list
// walks Mega Man 1 through 10 and then the spin-offs, so a server left running tours the series.
sv_randommaprotation 0

