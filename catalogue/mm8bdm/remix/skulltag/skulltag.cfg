// Mega Man 8-bit Deathmatch: Skulltag.
//
// Exec'd on top of the experience's own cfg, so only the difference is here. Setting a
// gamemode cvar clears every other one: see the CUSTOM_CVAR callbacks in deathmatch.cpp
// and team.cpp, which is why nothing below has to turn deathmatch off first.

skulltag true

// Captures, not frags.
pointlimit 5
timelimit 10

// A pool of its own, so the deathmatch rotation is replaced rather than
// added to: these are the only stages carrying flags.
clearmaplist
addmap MMCTF01
addmap MMCTF02
addmap MMCTF03
addmap MMCTF04
addmap MMCTF05
addmap MMCTF06
addmap MMCTF07
addmap MMCTF08
addmap MMCTF09
addmap MMCTF10
addmap MMCTF11
addmap MMCTF12
addmap MMCTF13
addmap MMCTF14
addmap MMCTF15
addmap MMCTF16
addmap MMCTF17
addmap MMCTF18
addmap MMCTF19
addmap MMCTF20
addmap MMCTF21
addmap MMCTF22
addmap MMCTF23
addmap MMCTF24
addmap MMCTF25
