// Super Skulltag: deathmatch, on the five arenas it ships.

deathmatch 1
timelimit 10
fraglimit 25

sv_weaponstay true
sv_norespawninvul true
sv_samespawnspot true

sv_allowfreelook true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// [rc4l] Written out rather than chained. SSTDM05 names d2dm1 as its next map, which is Skulltag's
// own content rather than this pack's, so following the chain walks the server out of the
// experience it was started for.
addmap SSTDM01
addmap SSTDM02
addmap SSTDM03
addmap SSTDM04
addmap SSTDM05
