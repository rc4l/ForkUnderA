// Super Skulltag: Monster Mash. The same campaign with a different bestiary walking around it.

cooperative 1
deathmatch 0

// Ultra-Violence.
skill 3

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

sv_maxlives 0
sv_itemrespawn true
sv_weaponstay true

sv_sharekeys true
sv_unblockplayers true
sv_nodrop true
sv_allowfreelook true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 0

// [rc4l] Written out rather than left to the pack's own chain, which cannot be followed. Its
// campaign is Doom II's numbering with holes in it -- there is no SSTMAP11, 12, 15, 16, 18, 20, 23,
// 24 or 27 -- and the maps either side of each hole carry no `next`, so a server reaching SSTMAP10
// looks for a map that was never shipped.
addmap SSTMAP01
addmap SSTMAP02
addmap SSTMAP03
addmap SSTMAP04
addmap SSTMAP05
addmap SSTMAP06
addmap SSTMAP07
addmap SSTMAP08
addmap SSTMAP09
addmap SSTMAP10
addmap SSTMAP13
addmap SSTMAP14
addmap SSTMAP17
addmap SSTMAP19
addmap SSTMAP21
addmap SSTMAP22
addmap SSTMAP25
addmap SSTMAP26
addmap SSTMAP28
addmap SSTMAP29
addmap SSTMAP30
addmap SSTMAP31
addmap SSTMAP32
addmap SSTMAP33
addmap SSTMAP34
addmap SSTMAP35
addmap SSTMAP36
addmap SSTMAP37
addmap SSTMAP38
