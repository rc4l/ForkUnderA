// Super Skulltag: invasion, on the two maps it ships for it.

invasion true
cooperative true

// Players are not fighting each other here, so the deathmatch flags do not apply.
dmflags 0
dmflags2 0
compatflags 0
compatflags2 0
zadmflags 0
zacompatflags 0

// Ultra-Violence.
skill 3

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 0

// [rc4l] Both, written out. SSTINV02 chains to D2INV1, which is Skulltag's own invasion map rather
// than this pack's, so the chain leaves the experience after one loop.
addmap SSTINV01
addmap SSTINV02
