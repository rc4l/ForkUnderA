// [rc4l] Exec'd on top of the experience's own cfg rather than instead of it, which is what
// clearmaplist below is for: the rotation has to be REPLACED, not added to, or this mode
// would inherit the deathmatch maps as well as its own.

// Skulltag: Last Man Standing. One life a round, so no respawn flags here.

lastmanstanding true

// Three rounds takes it, five minutes a round at most.
winlimit 3
timelimit 10

sv_weaponstay true

// [rc4l] Leaving no-respawn out is the point in deathmatch; in LMS the round ends instead, so what
// stays here is only the part the deathmatch config keeps for the runes.
sv_norespawninvul true
sv_samespawnspot true

Compat_SkulltagJumping true

// The LMS rotation, read out of the pk3's own mapinfo.
clearmaplist
addmap D2LMS1
addmap D2LMS2
addmap D2LMS3
addmap D2LMS4
addmap D2LMS5
addmap D2LMS6
addmap D2LMS7
addmap D2LMS8
addmap D2LMS9
addmap D2LMS10

sv_allowfreelook true

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false
