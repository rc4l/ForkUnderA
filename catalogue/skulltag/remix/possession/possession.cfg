// [rc4l] Exec'd on top of the experience's own cfg. No clearmaplist and no maps: the stone
// spawns at a deathmatch start when the mapper placed none, so the deathmatch rotation is
// exactly the right pool and replacing it would be throwing maps away for no reason.

possession true

// Points, not frags: time holding the stone is the score.
pointlimit 10
timelimit 10
