// Skulltag: Invasion. Everyone on the same side against waves of monsters.

invasion true
cooperative true

// Players are not fighting each other here, so the deathmatch flags do not apply.

Compat_SkulltagJumping true

// Ultra-Violence.
skill 3

// The invasion rotation, read out of the pk3's own mapinfo.
addmap D2INV1
addmap D2INV2
addmap D2INV3
addmap D2INV4
addmap D2INV5

sv_sharekeys true
sv_unblockplayers true
sv_nodrop true
sv_allowfreelook true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false
