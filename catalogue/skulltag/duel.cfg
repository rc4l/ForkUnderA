// Skulltag: Duel. One on one, everyone else waiting their turn.

duel true

sv_weaponstay true
sv_norespawninvul true
sv_samespawnspot true

Compat_SkulltagJumping true

// The duel rotation, read out of the pk3's own mapinfo.
addmap D2DUEL1
addmap D2DUEL2
addmap D2DUEL3
addmap D2DUEL4
addmap D2DUEL5
addmap D2DUEL6
addmap D2DUEL7
addmap D2DUEL8
addmap D2DUEL9
addmap D2DUEL10
addmap D2DUELSE

sv_allowfreelook true

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false
