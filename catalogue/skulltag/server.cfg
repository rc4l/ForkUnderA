// Skulltag: Deathmatch. The default variant, so it keeps the name older builds look for.
// The json says which FILES to load; this says which MAPS to play and how.
// No sv_hostname here: the host's own name wins.

deathmatch true

// A weapon stays on the floor after someone takes it.
sv_weaponstay true

// [rc4l] No-respawn and no-runes are deliberately absent from what the reference config runs: one
// stopped you coming back after dying, the other turned off the runes this entry is partly for.
sv_norespawninvul true
sv_samespawnspot true

Compat_SkulltagJumping true

// The deathmatch rotation, read out of the pk3's own mapinfo.
addmap D2DM1
addmap D2DM2
addmap D2DM3
addmap D2DM4
addmap D2DM5
addmap D2DM6
addmap D2DM7
addmap D2DM8
addmap D2DM9
addmap D2DM10
addmap D2DMSEC

sv_allowfreelook true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false
