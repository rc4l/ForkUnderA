// Skulltag, exec'd by the hosted server.
// The json says which FILES to load; this says which MAPS to play and how.
// No sv_hostname here: the host's own name wins.

// DF_WEAPONS_STAY (4): a weapon stays on the floor after someone takes it.
dmflags 4

// 21508 minus DF2_NO_RESPAWN (16384), which stopped you coming back after dying, and minus
// DF2_NO_RUNES (4), which turned off the runes this entry is partly for. Leaves respawn without
// invulnerability, and respawning where you died.
dmflags2 5120

compatflags 0
compatflags2 0
zadmflags 0
zacompatflags 0

// The rotation, read out of the pk3's own mapinfo.
