// Skulltag: Capture the Flag. Two teams, one flag each.

ctf true

// Five captures takes it, ten minutes at most.
pointlimit 5
timelimit 10

sv_weaponstay true
sv_norespawninvul true
sv_samespawnspot true

Compat_SkulltagJumping true

// The CTF rotation, read out of the pk3's own mapinfo.
addmap D2CTF1
addmap D2CTF2
addmap D2CTF3
addmap D2CTF4
addmap D2CTF5
addmap D2CTF6
addmap D2CTF7
addmap D2CTF8
addmap D2CTF9
addmap D2CTF10

sv_allowfreelook true

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false
