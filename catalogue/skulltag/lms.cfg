// Skulltag: Last Man Standing. One life a round, so no respawn flags here.

lastmanstanding true

dmflags 4

// DF2_NO_RESPAWN's absence is the point in deathmatch; in LMS the round ends instead, so this drops
// back to the runes-only part of the deathmatch number.
dmflags2 5120

Compat_SkulltagJumping true

compatflags 0
compatflags2 0
zadmflags 0
zacompatflags 0

// The LMS rotation, read out of the pk3's own mapinfo.
addmap D2LMS1
addmap D2LMS2
addmap D2LMS3
addmap D2LMS4
addmap D2LMS5
addmap D2LMS6
addmap D2LMS7
addmap D2LMS8
addmap D2LMS9
addmap D2LMS10
