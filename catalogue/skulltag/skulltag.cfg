// Skulltag: Skulltag. The mode the pack is named after -- one skull, both teams want it.

skulltag true

// Five points takes it, ten minutes at most.
pointlimit 5
timelimit 10

sv_weaponstay true
sv_norespawninvul true
sv_samespawnspot true

Compat_SkulltagJumping true

// The Skulltag rotation, read out of the pk3's own mapinfo.
addmap D2ST1
addmap D2ST2
addmap D2ST3
addmap D2ST4
addmap D2ST5
addmap D2ST6
addmap D2ST7
addmap D2ST8
addmap D2ST9

sv_allowfreelook true

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false
