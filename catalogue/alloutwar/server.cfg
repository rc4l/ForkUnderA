// All Out War 2: Nasty Dogs. Two bases, one team each, and a war economy in between.
//
// [rc4l] Decoded from the numbers a running server reports -- dmflags 9584640, dmflags2 89888610,
// compatflags 0, compatflags2 0, zadmflags 32768, zacompatflags 131072 -- and written out by name.
//
// The five files load data, code, maps, music, patch, and that last position is the one that
// matters: aow2.3_patch replaces the mapinfo the maps pk3 ships and adds the scoreboard columns the
// code reads, so anything loaded after it would be reverting the patch.

teamgame true

// Two teams, and only two: teaminfo.txt clears the list and defines Blue and Red, and every map
// places one set of team starts for each. There is no third side to give.

// The only skill the pack defines. It runs clearskills and declares one block, "Normal", which
// already carries ammofactor 2.0 -- so there is no Ultra-Violence to ask for and no sv_doubleammo
// worth setting on top of a skill that doubles it.
skill 0

// No clock. A round ends when a team's base falls, and the mod runs its own countdown to sudden
// death (zeta_suddendeathtime, thirty minutes) which a timelimit would cut across.
timelimit 0

// Players buy their loadout, so the field is not where equipment comes from: dropped weapons stay
// dropped, the barrels come back, and ammo is never checked against a weapon you paid for.
sv_weapondrop true
sv_barrelrespawn true
sv_dontcheckammo true
sv_infiniteinventory true
sv_itemrespawn true
sv_nodrop true

// The mod assigns and balances teams itself, through its own switcher.
sv_noteamselect true

// You respawn at your own base, immediately and unprotected. Spawn invulnerability at a fixed spot
// is a shield handed to whoever is camping it.
sv_samespawnspot true
sv_norespawninvul true

sv_allowjump true
sv_allowcrouch true
compat_limited_airmovement true

// The mod draws its own HUD and field of view, and its own radar in place of the ally automap.
sv_nofov true
sv_noautomapallies true
sv_disallowspying true
sv_disallowsuicide true
sv_losefrag true

sv_bfgfreeaim true
sv_killallmonsters true
sv_nocountendmonst true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

// Shuffled, as an arena pack rather than a campaign.
sv_randommaprotation 1

// The twenty-seven maps, read from aow2.3_maps. The pack's twenty-eighth, "debug", is its testing
// map and is left out.
addmap aow01
addmap aow02
addmap aow03
addmap aow04
addmap aow05
addmap aow06
addmap aow07
addmap aow08
addmap aow09
addmap aow10
addmap aow11
addmap aow12
addmap aow13
addmap aow14
addmap aow15
addmap aow16
addmap aow17
