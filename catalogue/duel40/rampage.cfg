// Rampage Duel, on the same settings Duel 40 plays by.

// [rc4l] `duel` is a latched CVAR, not a "gamemode duel" command. There is no such CCMD.
duel true

// A duel ends on frags, not on a clock.
fraglimit 25
timelimit 0

// One win and the next challenger is up.
winlimit 1

// 5515684 plus DF_NO_EXIT (1024): touching an exit kills you instead of ending the map.
dmflags 5516708
dmflags2 1024
compatflags 1894911359
compatflags2 0
zadmflags 268468256
zacompatflags 24511048

// [rc4l] MAP00 first, because it is where the pack opens: it is the front page that names itself
// ("Rampage Duel by TheFatWilly"), the same job Duel 40's START does, and the entry starts there.
//
// The sixteen follow it rather than the server sitting on one map, which is where this differs from
// Duel 40 beside it: that pack is one arena and a queue of challengers, and this one is sixteen
// borrowed classics whose whole point is that you move through them.
sv_randommaprotation 0

addmap MAP00
addmap MAP01
addmap MAP02
addmap MAP03
addmap MAP04
addmap MAP05
addmap MAP06
addmap MAP07
addmap MAP08
addmap MAP09
addmap MAP10
addmap MAP11
addmap MAP12
addmap MAP13
addmap MAP14
addmap MAP15
addmap MAP16
