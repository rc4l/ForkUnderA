// Rampage Duel, on the same settings Duel 40 plays by.

// [rc4l] `duel` is a latched CVAR, not a "gamemode duel" command. There is no such CCMD.
duel true

// A duel ends on frags, not on a clock.
fraglimit 25
timelimit 0

// One win and the next challenger is up.
winlimit 1

// 5515684 plus DF_NO_EXIT (1024): touching an exit kills you instead of ending the map.
dmflags 5516708
dmflags2 1024
compatflags 1894911359
compatflags2 0
zadmflags 268468256
zacompatflags 24511048

// [rc4l] MAP00 ONLY, exactly as Duel 40 sits on START. MAP00 is not an arena: it is the pack's front
// page, naming itself and its author. Rotating the sixteen behind it would have thrown everyone back
// onto that page after every win, since winlimit 1 advances the map.
//
// The sixteen are reached by voting, which is what a duel server does anyway: two people agree on a
// map rather than taking whichever one came up.
sv_randommaprotation 0

addmap MAP00

// [rc4l] Named rather than inherited. These are bits on sv_forbidvoteflags, so a value left over
// from another game would decide whether anyone can pick a map at all -- and with a one-map rotation
// that is the difference between sixteen maps and one.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false