// Duel 32, on the same settings Duel 40 plays by.

// [rc4l] `duel` is a latched CVAR, not a "gamemode duel" command. There is no such CCMD.
duel true

// A duel ends on frags, not on a clock.
fraglimit 25
timelimit 0

// One win and the next challenger is up.
winlimit 1

// 5515684 plus DF_NO_EXIT (1024): touching an exit kills you instead of ending the map.
dmflags 5516708
dmflags2 1024
compatflags 1894911359
compatflags2 0
zadmflags 268468256
zacompatflags 24511048

// [rc4l] START only, exactly as Duel 40 does it. This pack ships its own START ("WELCOME TO DUEL32")
// and winlimit 1 advances the map, so a rotation would move everyone off whatever they were duelling
// on the moment somebody won.
sv_randommaprotation 0

addmap START

// [rc4l] Named rather than inherited, because with a one-map rotation this is the only way to reach
// the other thirty-three. They are bits on sv_forbidvoteflags, so a value left over from another
// game would otherwise decide it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false