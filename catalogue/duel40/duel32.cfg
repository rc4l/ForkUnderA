// Duel 32, on the same settings Duel 40 plays by.

// [rc4l] `duel` is a latched CVAR, not a "gamemode duel" command. There is no such CCMD.
duel true

// A duel ends on frags, not on a clock.
fraglimit 25
timelimit 0

// One win and the next challenger is up.
winlimit 1

// sv_noexit is the one addition to the reference duel settings: touching an exit kills you
// instead of ending the map.
sv_weaponstay true
sv_spawnfarthest true
sv_forcerespawn true
sv_noexit true
sv_infiniteammo true
sv_monsterrespawn true
sv_nofreelook true
sv_nofov true
sv_nocrouch true
sv_norespawninvul true
compat_shortTex true
compat_stairs true
compat_limitpain true
compat_silentpickup true
compat_nopassover true
compat_soundslots true
compat_wallrun true
compat_useblocking true
compat_ravenscroll true
compat_soundtarget true
compat_silentinstantfloors true
compat_crossdropoff true
compat_anybossdeath true
compat_minotaur true
compat_mushroom true
compat_hitscan true
compat_light true
compat_polyobj true
sv_nomedals true
sv_nodrop true
sv_noenemyicons true
compat_limited_airmovement true
compat_plasmabump true
compat_disabletaunts true
compat_originalsoundcurve true
compat_oldintermission true
compat_oldradiusdmg true
compat_oldrandom true
compat_explosionthrust true
compat_fullweaponlower true

// [rc4l] START only, exactly as Duel 40 does it. This pack ships its own START ("WELCOME TO DUEL32")
// and winlimit 1 advances the map, so a rotation would move everyone off whatever they were duelling
// on the moment somebody won.
sv_randommaprotation 0

addmap START

// [rc4l] Named rather than inherited, because with a one-map rotation this is the only way to reach
// the other thirty-three. They are bits on sv_forbidvoteflags, so a value left over from another
// game would otherwise decide it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false
