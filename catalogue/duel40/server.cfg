// Duel 40, exec'd by the hosted server.
// The json says which FILES to load; this says which MAPS to play and how.
// No sv_hostname here: the host's own name wins.

// [rc4l] `duel` is a latched CVAR, not a "gamemode duel" command -- there is no such CCMD, and the
// server answered "Unknown command" to it.
duel true

// A duel ends on frags, not on a clock.
fraglimit 25
timelimit 0

dmflags 5515684
dmflags2 1024
compatflags 1894911359
compatflags2 0
zadmflags 268468256
zacompatflags 24511048

// The 42-map rotation, read out of the pk3's own MAPINFO. START is the intro
// screen, not a duel map, so it is not in here.
addmap BOO
addmap BRIT10M7
addmap BRIT11M1
addmap BRIT11M5
addmap BSPEPI
addmap CGI1M8
addmap CLASSM1
addmap MAP01
addmap DWGO5M1
