// Duel 40, exec'd by the hosted server.
// The json says which FILES to load; this says which MAPS to play and how.
// No sv_hostname here: the host's own name wins.

// [rc4l] `duel` is a latched CVAR, not a "gamemode duel" command. There is no such CCMD.
duel true

// A duel ends on frags, not on a clock.
fraglimit 25
timelimit 0

dmflags 5515684
dmflags2 1024
compatflags 1894911359
compatflags2 0
zadmflags 268468256
zacompatflags 24511048

// Rotation: START only, so the server stays on it.
addmap START
