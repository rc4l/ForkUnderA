// Duel 40, exec'd by the hosted server.
// The json says which FILES to load; this says which MAPS to play and how.
// No sv_hostname here: the host's own name wins.

// [rc4l] `duel` is a latched CVAR, not a "gamemode duel" command. There is no such CCMD.
duel true

// A duel ends on frags, not on a clock.
fraglimit 25
timelimit 0

// One win and the next challenger is up.
winlimit 1

// 5515684 plus DF_NO_EXIT (1024): touching an exit kills you instead of ending the map.
dmflags 5516708
dmflags2 1024
compatflags 1894911359
compatflags2 0
zadmflags 268468256
zacompatflags 24511048

// Rotation: START only, so the server stays on it.
addmap START

// [rc4l] Named rather than inherited, for the same reason the rotation above is one map: without a
// vote there are forty maps nobody can reach. They are bits on sv_forbidvoteflags, which no cfg here
// had been setting, so whatever the server last ran decided it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false