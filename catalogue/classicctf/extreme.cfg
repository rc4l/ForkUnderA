// Classic Capture the Flag: Extreme, nine maps.

ctf true

// Five captures takes it, ten minutes at most.
pointlimit 5
timelimit 10

// Read off a running server rather than assembled bit by bit here.
//
// [rc4l] zadmflags 32800 is ZADF_NODROP (1<<15) plus ZADF_NO_MEDALS (1<<5), so the spree medals are
// already off in this number. sv_nomedals is that same bit under another name, and cl_medals is the
// client's own preference, which a server cannot reach.
dmflags 4215812
dmflags2 4195812
compatflags 64
compatflags2 0
zadmflags 32800
zacompatflags 5374952

sv_randommaprotation 1

// Named rather than numbered, so this list is not MAP01 upward like most of the others. All
// nine carry a blue and a red flag and no third team.
addmap tlsxctf1
addmap tlsxctf2
addmap tlsxctf3
addmap tlsxctf4
addmap tlsxctf5
addmap tlsxctf6
addmap tlsxctf7
addmap tlsxctf8
addmap tlsxctf9
