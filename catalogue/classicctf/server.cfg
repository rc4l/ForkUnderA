// Classic Capture the Flag: the International Doom League set, thirty-eight maps.

ctf true

// Five captures takes it, ten minutes at most.
pointlimit 5
timelimit 10

// [rc4l] Taken from a running server. sv_nomedals further down is what turns the spree medals off;
// cl_medals is the client's own preference and a server cannot reach it.
sv_weaponstay true
sv_noexit true
sv_nomonsters true
sv_itemrespawn true
sv_nocrouch true
// [rc4l] Degeneration is deliberately absent. It bleeds a player back down to 100% after any pickup
// takes them over it, which on a CTF map turns every megasphere into a countdown, not a reward.
sv_doubleammo true
sv_bfgfreeaim true
sv_norespawninvul true
sv_disallowsuicide true
sv_norunes true
sv_noteamselect true
compat_wallrun true
sv_nomedals true
sv_nodrop true
compat_limited_airmovement true
compat_disabletaunts true
compat_oldintermission true
compat_oldrandom true
compat_dont_stop_player_scripts_on_disconnect true
compat_explosionthrust true
compat_bridgedrops true
compat_oldzdoomzmovement true
compat_fullweaponlower true

sv_allowfreelook true

// [rc4l] Every one of these sets a fixed rotation, so the map is the one thing players might
// reasonably want a say in. All three vote kinds are named rather than left to whatever the server
// last had: they are bits on sv_forbidvoteflags, so a value carried over from another game would
// decide this silently.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false
sv_randommaprotation 1

// All thirty-eight, and every one carries a blue and a red flag. The league's own numbering is
// not a clean run: three warmup maps named m01 to m03 sit beside map01 to map33, and map07 and
// map28 each have a 'b' revision shipped alongside them rather than replacing them.
addmap m01
addmap m02
addmap m03
addmap map01
addmap map02
addmap map03
addmap map04
addmap map05
addmap map06
addmap map07
addmap map07b
addmap map08
addmap map09
addmap map10
addmap map11
addmap map12
addmap map13
addmap map14
addmap map15
addmap map16
addmap map17
addmap map18
addmap map19
addmap map20
addmap map21
addmap map22
addmap map23
addmap map24
addmap map25
addmap map26
addmap map27
addmap map28
addmap map28b
addmap map29
addmap map30
addmap map31
addmap map32
addmap map33
