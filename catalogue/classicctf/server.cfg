// Classic Capture the Flag: the International Doom League set, thirty-eight maps.

ctf true

// Five captures takes it, ten minutes at most.
pointlimit 5
timelimit 10

// Read off a running server rather than assembled bit by bit here.
//
// [rc4l] zadmflags 32800 is ZADF_NODROP (1<<15) plus ZADF_NO_MEDALS (1<<5), so the spree medals are
// already off in this number. sv_nomedals is that same bit under another name, and cl_medals is the
// client's own preference, which a server cannot reach.
dmflags 4215812
// [rc4l] 4195812 with DF2_YES_DEGENERATION (1<<7) cleared. That bit bleeds a player back down
// to 100% after any pickup takes them over it, which on a CTF map turns every megasphere into
// a countdown rather than a reward.
dmflags2 4195684
compatflags 64
compatflags2 0
zadmflags 32800
zacompatflags 5374952

// [rc4l] Every one of these sets a fixed rotation, so the map is the one thing players might
// reasonably want a say in. All three vote kinds are named rather than left to whatever the server
// last had: they are bits on sv_forbidvoteflags, so a value carried over from another game would
// decide this silently.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false
sv_randommaprotation 1

// All thirty-eight, and every one carries a blue and a red flag. The league's own numbering is
// not a clean run: three warmup maps named m01 to m03 sit beside map01 to map33, and map07 and
// map28 each have a 'b' revision shipped alongside them rather than replacing them.
addmap m01
addmap m02
addmap m03
addmap map01
addmap map02
addmap map03
addmap map04
addmap map05
addmap map06
addmap map07
addmap map07b
addmap map08
addmap map09
addmap map10
addmap map11
addmap map12
addmap map13
addmap map14
addmap map15
addmap map16
addmap map17
addmap map18
addmap map19
addmap map20
addmap map21
addmap map22
addmap map23
addmap map24
addmap map25
addmap map26
addmap map27
addmap map28
addmap map28b
addmap map29
addmap map30
addmap map31
addmap map32
addmap map33
