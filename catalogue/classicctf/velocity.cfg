// Classic Capture the Flag: Velocity, thirty-two maps.

ctf true

// Five captures takes it, ten minutes at most.
pointlimit 5
timelimit 10

// Read off a running server rather than assembled bit by bit here.
//
// [rc4l] zadmflags 32800 is ZADF_NODROP (1<<15) plus ZADF_NO_MEDALS (1<<5), so the spree medals are
// already off in this number. sv_nomedals is that same bit under another name, and cl_medals is the
// client's own preference, which a server cannot reach.
dmflags 4215812
dmflags2 4195812
compatflags 64
compatflags2 0
zadmflags 32800
zacompatflags 5374952

sv_randommaprotation 1

// All thirty-two, and all thirty-two carry a flag of each colour.
addmap MAP01
addmap MAP02
addmap MAP03
addmap MAP04
addmap MAP05
addmap MAP06
addmap MAP07
addmap MAP08
addmap MAP09
addmap MAP10
addmap MAP11
addmap MAP12
addmap MAP13
addmap MAP14
addmap MAP15
addmap MAP16
addmap MAP17
addmap MAP18
addmap MAP19
addmap MAP20
addmap MAP21
addmap MAP22
addmap MAP23
addmap MAP24
