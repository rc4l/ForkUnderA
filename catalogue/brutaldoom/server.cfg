// Brutal Doom: cooperative, on the horde defence maps it ships.

cooperative 1
deathmatch 0
survival false

// [rc4l] No map rotation. The five defence maps are DF01 to DF05 and the pack's own mapinfo chains
// them into a loop, so the order is already stated where the maps are. The entry opens on DF01.
//
// They live in BDHordeModeMaps.wad INSIDE the pk3, which is why they do not show up beside the test
// maps in the archive's own maps folder. The deathmatch set (BDM01-10) and the PlayStation maps are
// in there too, unused by this experience.
sv_randommaprotation 0

// [rc4l] Nothing exotic set here on purpose. No settings came with this one, and the mod does its own
// weapons, monsters and gore through DECORATE and ZScript rather than through server flags, so
// inventing numbers would be guessing at what its author already decided.
dmflags 0
dmflags2 0
compatflags 0
compatflags2 0
zadmflags 0
zacompatflags 0

sv_maxlives 0
sv_itemrespawn true
sv_weaponstay true
