// Brutal Doom: deathmatch, on the Eon Collection's settings.

sv_weaponstay true
sv_forcerespawn true
sv_noexit true
sv_nomonsters true
sv_itemrespawn true
sv_allowjump true
sv_nocrouch true
sv_barrelrespawn true
sv_norespawninvul true
sv_disallowsuicide true
sv_norunes true
sv_nomedals true
sv_nodrop true
compat_limited_airmovement true
compat_instantrespawn true
compat_disabletaunts true
compat_clientssendfullbuttoninfo true
compat_oldrandom true
compat_oldzdoomzmovement true
compat_fullweaponlower true

sv_forcerespawntime 4
timelimit 10
fraglimit 25
deathmatch 1
skill 4

sv_allowfreelook true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 0

// [rc4l] Written out rather than left to the pack's own chain, which cannot be followed here: BDM07
// names BDM09 as its next map, so BDM08 is never reached, and BDM12 is in no chain at all. All
// eleven that exist are in the rotation; there is no BDM11.
addmap BDM01
addmap BDM02
addmap BDM03
addmap BDM04
addmap BDM05
addmap BDM06
addmap BDM07
addmap BDM08
addmap BDM09
addmap BDM10
addmap BDM12
