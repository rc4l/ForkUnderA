// Destination Unknown: cooperative, and cooperative only. There is no survival way of playing it.
//
// Settings are Invasion UAC's, which is where this pack is usually run alongside. Keep the two in
// step; the rotation is the only part that differs.

cooperative 1
deathmatch 0
survival false

// Ultra-Violence.
skill 3

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// [rc4l] The infinite ammo is not a preference. These packs are built on the assumption that you
// never stop firing, and without it the later maps run the players dry and cannot be finished.
sv_infiniteammo true

sv_weaponstay true
sv_itemrespawn true
sv_allowfreelook true
sv_nocrouch true

sv_bfgfreeaim true
sv_disallowsuicide true
sv_shotgunstart true

// The chasecam the source server allowed is deliberately absent. Third person is a cheat.

sv_sharekeys true
sv_unblockallies true
sv_nodrop true

// Soulspheres and the like keep their gravity.
compat_nogravity_spheres true

sv_unblockplayers true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// Nineteen, which is all of them.
addmap MAP01
addmap MAP02
addmap MAP03
addmap MAP04
addmap MAP05
addmap MAP06
addmap MAP07
addmap MAP08
addmap MAP09
addmap MAP10
addmap MAP11
addmap MAP12
addmap MAP13
addmap MAP14
addmap MAP15
addmap MAP16
addmap MAP17
addmap MAP18
addmap MAP19
