// Destination Unknown: cooperative, and cooperative only. There is no survival way of playing it.
//
// Settings are Invasion UAC's, which is where this pack is usually run alongside. Keep the two in
// step; the rotation is the only part that differs.

cooperative 1
deathmatch 0
survival false

// Ultra-Violence.
skill 3

// [rc4l] Weapons stay, INFINITE AMMO, items respawn, freelook, no crouching.
//
// The infinite ammo is not a preference. These packs are built on the assumption that you never
// stop firing, and without it the later maps run the players dry and cannot be finished.
dmflags 4737028

// Confirmed as its own cvar as well as bit 11 above, because it is the one setting this pack
// cannot be played without.
sv_infiniteammo true

// BFG freeaim, a shotgun on every respawn, and no suiciding out.
//
// DF2_CHASECAM is dropped from what the source server ran. Third person is a cheat everywhere else
// in this catalogue and there is no reason for it to be one exception here.
dmflags2 4196608

compatflags 0
compatflags2 0

// Shared keys, allies unblocked, nothing dropped.
zadmflags 49216

// Soulspheres and the like keep their gravity.
zacompatflags 16

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// Nineteen, which is all of them.
addmap MAP01
addmap MAP02
addmap MAP03
addmap MAP04
addmap MAP05
addmap MAP06
addmap MAP07
addmap MAP08
addmap MAP09
addmap MAP10
addmap MAP11
addmap MAP12
addmap MAP13
addmap MAP14
addmap MAP15
addmap MAP16
addmap MAP17
