// Sunder: the same settings as the rest of the list, on the twenty-three maps it actually has.
//
// [rc4l] A copy of server.cfg rather than a shared one, and the rotation is the only reason. Sunder
// runs MAP01-MAP21 and then jumps to MAP31, so the thirty-two-map rotation next door would send it
// to nine maps that are not in the wad. Nothing above the rotation differs; keep the copies in step
// when any of them is edited.

cooperative 1
deathmatch 0
survival false

// Ultra-Violence.
skill 3

// No jumping and no crouching, the way all of these were built to be played.
dmflags 4259840

// [rc4l] No runes, infinite inventory, no ally automap, no spying, chasecam and no suicide.
//
// Two things the server this was read off had are deliberately NOT in this number. DF2_NO_RESPAWN
// would make the Classic way of playing a one-life run, and how many lives you get is the whole
// difference between the two remixes offered here. DF2_YES_DEGENERATION is out because health above
// 100% draining away is not wanted anywhere in this catalogue.
dmflags2 7929860

compatflags 0
compatflags2 0

// Players walk through each other, keys are shared, teams survive a map change.
zadmflags 208

// Instant respawn, and the old intermission screen.
zacompatflags 4718592

// The classic sets do not respawn their items and the maps are balanced on that.
sv_itemrespawn false

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// Twenty-three, which is all of them. There is no MAP22 through MAP30.
addmap MAP01
addmap MAP02
addmap MAP03
addmap MAP04
addmap MAP05
addmap MAP06
addmap MAP07
addmap MAP08
addmap MAP09
addmap MAP10
addmap MAP11
addmap MAP12
addmap MAP13
addmap MAP14
addmap MAP15
addmap MAP16
addmap MAP17
addmap MAP18
addmap MAP19
addmap MAP20
addmap MAP21
addmap MAP31
addmap MAP32
