// Popular Classic PvE Maps: cooperative, the same settings for every mapset in the list.

cooperative 1
deathmatch 0
survival false

// Ultra-Violence.
skill 3

// No jumping and no crouching, the way all of these were built to be played.
dmflags 4259840

// [rc4l] No runes, infinite inventory, no ally automap, no spying and no suicide.
//
// Three things the server this was read off had are deliberately NOT in this number. DF2_NO_RESPAWN
// would make the Classic way of playing a one-life run, and how many lives you get is the whole
// difference between the two remixes offered here. DF2_YES_DEGENERATION is out because health above
// 100% draining away is not wanted anywhere in this catalogue, and DF2_CHASECAM is out because
// third person is a cheat.
dmflags2 5832708

compatflags 0
compatflags2 0

// Players walk through each other, keys are shared, teams survive a map change.
zadmflags 208

// Instant respawn, and the old intermission screen.
zacompatflags 4718592

// The classic sets do not respawn their items and the maps are balanced on that.
sv_itemrespawn false

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

