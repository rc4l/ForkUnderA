// Back to Saturn X E1: the same settings as the rest of the list, on the maps it actually has.
//
// [rc4l] A copy of server.cfg rather than a shared one, and the rotation is the only reason. This
// episode fills MAP01 to MAP25 and both secret slots, and nothing between MAP26 and MAP30, so
// the thirty-two-map rotation next door would send it to five maps that are not in the wad.
// Nothing above the rotation differs; keep the copies in step when any of them is edited.

cooperative 1
deathmatch 0
survival false

// Ultra-Violence.
skill 3

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// No jumping and no crouching, the way all of these were built to be played.
sv_nojump true
sv_nocrouch true

// [rc4l] Three things the server this was read off had are deliberately absent. No-respawn would
// make the Classic way of playing a one-life run, and how many lives you get is the whole
// difference between the two remixes offered here. Degeneration is out because health above 100%
// draining away is not wanted anywhere in this catalogue, and the chasecam is out because third
// person is a cheat.
sv_infiniteinventory true
sv_noautomapallies true
sv_disallowspying true
sv_disallowsuicide true
sv_norunes true

// Players walk through each other, keys are shared, teams survive a map change.
sv_unblockplayers true
sv_sharekeys true
sv_keepteams true

// Instant respawn, and the old intermission screen.
compat_instantrespawn true
compat_oldintermission true

// The classic sets do not respawn their items and the maps are balanced on that.
sv_itemrespawn false

sv_nodrop true
sv_allowfreelook true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

// [rc4l] The secret slots are deliberately NOT in the rotation.
//
// A normal exit takes the rotation's next entry whatever the map itself says, so listing MAP31 here
// means walking out of MAP30 and straight into a map the pack hid on purpose. It also means playing
// it twice, since the secret exit still works and reaches it mid-run.
//
// Leaving them out costs nothing: a secret exit uses the map's OWN next-secret entry whenever that
// map exists in the wad, so it does not care what the rotation holds. Every pack in this list has a
// working secret exit, either declared or inherited from the base game's own progression. Coming
// back out lands on the rotation's next entry, which is the map after the one you left.

// [rc4l] IN ORDER, not shuffled. These are campaigns: Alien Vendetta and Scythe get harder from
// MAP01 to MAP32 on purpose, and a random pick drops a fresh party onto a slaughter map with the
// pistol they started with.
sv_randommaprotation 0

// All thirty-two. Alien Vendetta, Scythe, Hell Revealed II, Ancient Aliens and Sunlust each fill
// MAP01-MAP32.

addmap MAP01
addmap MAP02
addmap MAP03
addmap MAP04
addmap MAP05
addmap MAP06
addmap MAP07
addmap MAP08
addmap MAP09
addmap MAP10
addmap MAP11
addmap MAP12
addmap MAP13
addmap MAP14
addmap MAP15
addmap MAP16
addmap MAP17
addmap MAP18
addmap MAP19
addmap MAP20
addmap MAP21
addmap MAP22
addmap MAP23
addmap MAP24
addmap MAP25
