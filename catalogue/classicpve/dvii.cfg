// Deus Vult II: the same settings as the rest of the list, on the maps it actually plays.
//
// [rc4l] A copy of server.cfg rather than a shared one, and the rotation is the only reason. This
// one is not merely short, it is out of ORDER: the campaign runs MAP01, 02, 03, then jumps to 12,
// 13, 15 and on to 30, and the sixteen slots it skips hold maps no ordinary exit ever reaches.
// Playing MAP01 to MAP32 in numerical order would have run half a campaign and half a scrapheap.
//
// Read off the pack's own exits rather than off the numbers. Nothing above the rotation differs;
// keep the copies in step when any of them is edited.

cooperative 1
deathmatch 0
survival false

// Ultra-Violence.
skill 3

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// No jumping and no crouching, the way all of these were built to be played.
sv_nojump true
sv_nocrouch true

// [rc4l] Three things the server this was read off had are deliberately absent. No-respawn would
// make the Classic way of playing a one-life run, and how many lives you get is the whole
// difference between the two remixes offered here. Degeneration is out because health above 100%
// draining away is not wanted anywhere in this catalogue, and the chasecam is out because third
// person is a cheat.
sv_infiniteinventory true
sv_noautomapallies true
sv_disallowspying true
sv_disallowsuicide true
sv_norunes true

// Players walk through each other, keys are shared, teams survive a map change.
sv_unblockplayers true
sv_sharekeys true
sv_keepteams true

// Instant respawn, and the old intermission screen.
compat_instantrespawn true
compat_oldintermission true

// The classic sets do not respawn their items and the maps are balanced on that.
sv_itemrespawn false

sv_nodrop true
sv_allowfreelook true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false
// [rc4l] The secret slots are deliberately NOT in the rotation. MAP31 is reached from MAP15 or
// MAP29 and MAP32 from MAP31, which is where the pack put them.

// [rc4l] IN ORDER, and here the order is the pack's rather than the numbers'.
sv_randommaprotation 0

addmap MAP01
addmap MAP02
addmap MAP03
addmap MAP12
addmap MAP13
addmap MAP15
addmap MAP16
addmap MAP17
addmap MAP18
addmap MAP19
addmap MAP20
addmap MAP21
addmap MAP22
addmap MAP23
addmap MAP29
addmap MAP30
