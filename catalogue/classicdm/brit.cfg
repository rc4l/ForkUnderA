// Popular Deathmatch Maps: The Brit 10 and 11. Thirty-one maps, shuffled.
//
// Settings are Onslaught's. Keep the two in step; the rotation is the only part that differs.

sv_weaponstay true
sv_forcerespawn true
sv_noexit true
sv_nomonsters true
sv_itemrespawn true
sv_allowjump true
sv_nocrouch true
sv_barrelrespawn true
sv_norespawninvul true
sv_disallowsuicide true
sv_norunes true
sv_nomedals true
sv_nodrop true
sv_allowfreelook true
compat_limited_airmovement true
compat_instantrespawn true
compat_disabletaunts true
compat_clientssendfullbuttoninfo true
compat_oldrandom true
compat_oldzdoomzmovement true
compat_fullweaponlower true

// Skulltag's jump physics, which is what these packs were played with.
Compat_SkulltagJumping true

deathmatch 1
sv_forcerespawntime 4
timelimit 10
fraglimit 25
skill 4

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1
