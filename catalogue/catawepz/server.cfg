// Cata WeaponZ: deathmatch, on the Eon Collection's settings.
//
// [rc4l] NO map rotation here, and that is not an oversight. The two mappacks this can be played on
// both number their maps MAP01 upward, so an entry-level list would name maps that mean different
// things depending on which one is loaded. The rotation belongs to whichever pack is chosen and
// lives in its remix.

sv_weaponstay true
sv_forcerespawn true
sv_noexit true
sv_nomonsters true
sv_itemrespawn true
sv_allowjump true
sv_nocrouch true
sv_barrelrespawn true
sv_norespawninvul true
sv_disallowsuicide true
sv_norunes true
sv_nomedals true
sv_nodrop true
compat_limited_airmovement true
compat_instantrespawn true
compat_disabletaunts true
compat_clientssendfullbuttoninfo true
compat_oldrandom true
compat_oldzdoomzmovement true
compat_fullweaponlower true

sv_forcerespawntime 4
timelimit 10
fraglimit 25
deathmatch 1
skill 4

// The one thing that differs from Eon: Skulltag's jump physics.
Compat_SkulltagJumping true
sv_allowfreelook true
