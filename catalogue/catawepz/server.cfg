// Cata WeaponZ: deathmatch, on the Eon Collection's settings.
//
// [rc4l] NO map rotation here, and that is not an oversight. The two mappacks this can be played on
// both number their maps MAP01 upward, so an entry-level list would name maps that mean different
// things depending on which one is loaded. The rotation belongs to whichever pack is chosen and
// lives in its remix.

dmflags 4347140
dmflags2 4195844
zadmflags 32800
compatflags 0
compatflags2 0
zacompatflags 1704714

sv_forcerespawntime 4
timelimit 10
fraglimit 25
deathmatch 1
skill 4

// The one thing that differs from Eon: Skulltag's jump physics.
Compat_SkulltagJumping true
