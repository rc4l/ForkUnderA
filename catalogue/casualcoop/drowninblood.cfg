// Casual Co-op Maps: Drown in Blood. Twenty-nine maps, and the fix pack that repairs six of them.

cooperative 1
deathmatch 0
survival false

// Ultra-Violence.
skill 3

// [rc4l] Ammo never runs out here, whatever the WEAPON SPEED slider is set to. The maps place
// nowhere near enough for what they spawn, and a party that runs dry on MAP17 has no way back.
//
// This holds at every stop of that slider, not only above the default: the slider writes
// sv_infiniteammo true and never writes false, precisely so a pack that cannot be finished without
// it can say so here and be believed.
sv_infiniteammo true

// No sv_doubleammo. Twice of unlimited is unlimited, and setting it would read as one of the two
// being an oversight.

sv_weaponstay true
sv_itemrespawn true
sv_allowfreelook true
sv_nocrouch true

sv_disallowsuicide true

sv_sharekeys true
sv_unblockallies true
sv_unblockplayers true
sv_nodrop true

// Soulspheres and the like keep their gravity.
compat_nogravity_spheres true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

// [rc4l] IN ORDER, not shuffled. These are campaigns, and a random pick drops a fresh party into
// the middle of one with the pistol they started with. It is also what makes the starting map
// worth choosing: on a shuffled rotation, where you begin says nothing about where you go next.
sv_randommaprotation 0

// [rc4l] Thirty, which is every map the two wads carry between them. There is no MAP24, MAP31 or
// MAP32 in either, and MAP29 exists only in the fix pack.
addmap MAP01
addmap MAP02
addmap MAP03
addmap MAP04
addmap MAP05
addmap MAP06
addmap MAP07
addmap MAP08
addmap MAP09
addmap MAP10
addmap MAP11
addmap MAP12
addmap MAP13
addmap MAP14
addmap MAP15
addmap MAP16
addmap MAP17
addmap MAP18
addmap MAP19
addmap MAP20
addmap MAP21
addmap MAP22
addmap MAP23
addmap MAP25
addmap MAP26
addmap MAP27
addmap MAP28
addmap MAP29
addmap MAP30
addmap MAP33
