// Casual Co-op Maps: Drown in Blood. Twenty-nine maps, and the fix pack that repairs six of them.

cooperative 1
deathmatch 0
survival false

// Ultra-Violence.
skill 3

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

sv_weaponstay true
sv_itemrespawn true
sv_allowfreelook true
sv_nocrouch true

sv_disallowsuicide true

sv_sharekeys true
sv_unblockallies true
sv_unblockplayers true
sv_nodrop true

// Soulspheres and the like keep their gravity.
compat_nogravity_spheres true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// [rc4l] Thirty, which is every map the two wads carry between them. There is no MAP24, MAP31 or
// MAP32 in either, and MAP29 exists only in the fix pack.
addmap MAP01
addmap MAP02
addmap MAP03
addmap MAP04
addmap MAP05
addmap MAP06
addmap MAP07
addmap MAP08
