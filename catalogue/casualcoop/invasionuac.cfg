// Casual Co-op Maps: Invasion UAC. Cooperative and cooperative only; there is no survival way of
// playing it, which is why the entry offers no lives.

cooperative 1
deathmatch 0
survival false

// Ultra-Violence.
skill 3

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// [rc4l] The infinite ammo is not a preference. The pack is built on the assumption that you never
// stop firing, and without it the later maps run the players dry and cannot be finished.
sv_infiniteammo true

sv_weaponstay true
sv_itemrespawn true
sv_allowfreelook true
sv_nocrouch true

sv_bfgfreeaim true
sv_disallowsuicide true
sv_shotgunstart true

// The chasecam the source server allowed is deliberately absent. Third person is a cheat.

sv_sharekeys true
sv_unblockallies true
sv_nodrop true

// Soulspheres and the like keep their gravity.
compat_nogravity_spheres true

// [rc4l] IN ORDER, not shuffled. These are campaigns, and a random pick drops a fresh party into
// the middle of one with the pistol they started with. It is also what makes the starting map
// worth choosing: on a shuffled rotation, where you begin says nothing about where you go next.
sv_randommaprotation 0

sv_unblockplayers true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

// All thirty-two.
addmap MAP01
addmap MAP02
