// The Eon Collection: Possession.
//
// Exec'd on top of the experience's own cfg, so only the difference is here. Setting a
// gamemode cvar clears every other one (see the CUSTOM_CVAR callbacks in deathmatch.cpp),
// which is why nothing below turns deathmatch off first. The maps carry over untouched:
// the stone and the last man both play on the deathmatch rotation.

possession true

// Points, not frags: time holding the stone is the score.
pointlimit 10
timelimit 10
