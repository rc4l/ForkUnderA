// The Eon Collection: Last Man Standing.
//
// Exec'd on top of the experience's own cfg, so only the difference is here. Setting a
// gamemode cvar clears every other one (see the CUSTOM_CVAR callbacks in deathmatch.cpp),
// which is why nothing below turns deathmatch off first. The maps carry over untouched:
// the stone and the last man both play on the deathmatch rotation.

lastmanstanding true

// Rounds won, not frags: this mode earns WINS, so fraglimit is never read.
winlimit 3
timelimit 10

// Kept from the round-based cfg this replaces: spawn apart, spheres fall, and
// the dead can still talk to each other.
sv_spawnfarthest true
compat_nogravity_spheres true
lms_spectatorchat 1
