// Ragnarok: Last Man Standing. One life a round, so no respawn flags here.

lastmanstanding true

// Three rounds takes it, five minutes a round at most.
winlimit 3
timelimit 5

sv_weaponstay true

// [rc4l] Leaving no-respawn out is the point in deathmatch; in LMS the round ends instead, so what
// stays here is only the part the deathmatch config keeps for the runes.
sv_norespawninvul true
sv_samespawnspot true

Compat_SkulltagJumping true

sv_allowfreelook true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// The same twenty-three arenas the deathmatch plays on.
addmap MAP01
addmap MAP02
addmap MAP03
addmap MAP04
addmap MAP05
addmap MAP06
addmap MAP07
addmap MAP08
addmap MAP09
addmap MAP10
addmap MAP11
addmap MAP12
addmap MAP13
addmap MAP14
addmap MAP15
addmap MAP16
addmap MAP17
addmap MAP18
addmap MAP19
addmap MAP20
addmap MAP21
addmap MAP22
addmap MAP23
