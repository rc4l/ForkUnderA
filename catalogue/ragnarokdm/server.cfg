// Ragnarok DM. Skulltag's deathmatch settings, on this pack's own maps.

deathmatch true

// A weapon stays on the floor after someone takes it.
sv_weaponstay true

// [rc4l] No-respawn and no-runes are deliberately absent from what the reference config runs: one
// stopped you coming back after dying, the other turned off the runes this entry is partly for.
sv_norespawninvul true
sv_samespawnspot true

Compat_SkulltagJumping true

sv_allowfreelook true

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// All twenty-three. ragnarokmp carries no maps of its own; it is the resources these are built from.
addmap MAP01
addmap MAP02
addmap MAP03
addmap MAP04
addmap MAP05
