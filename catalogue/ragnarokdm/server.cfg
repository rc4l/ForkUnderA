// Ragnarok DM. Skulltag's deathmatch settings, on this pack's own maps.

deathmatch true

// DF_WEAPONS_STAY (4): a weapon stays on the floor after someone takes it.
dmflags 4

// 21508 minus DF2_NO_RESPAWN (16384), which stopped you coming back after dying, and minus
// DF2_NO_RUNES (4), which turned off the runes Skulltag's content is partly for. Leaves respawn
// without invulnerability, and respawning where you died.
dmflags2 5120

Compat_SkulltagJumping true

compatflags 0
compatflags2 0
zadmflags 0
zacompatflags 0

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// All twenty-three. ragnarokmp carries no maps of its own; it is the resources these are built from.
addmap MAP01
addmap MAP02
addmap MAP03
addmap MAP04
addmap MAP05
addmap MAP06
addmap MAP07
addmap MAP08
addmap MAP09
addmap MAP10
addmap MAP11
addmap MAP12
addmap MAP13
addmap MAP14
addmap MAP15
addmap MAP16
addmap MAP17
addmap MAP18
addmap MAP19
addmap MAP20
addmap MAP21
addmap MAP22
addmap MAP23
