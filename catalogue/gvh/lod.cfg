// Ghouls vs Humans: Legacy of Darkness. Same game, older line: Team Last Man Standing, one life each
// for the humans to hold a corner with and one for the ghouls to take it.

teamlms true

// Three rounds takes it, five minutes a round at most.
winlimit 3
timelimit 5

// The mod brings its own classes, weapons and pickups, so the only rules set here are the ones about
// moving. Ghouls close distance by climbing and ducking, and taking either away is taking the team's
// half of the game away.
dmflags 0
dmflags2 0
sv_nojump false
sv_nocrouch false

compatflags 0
compatflags2 0
zadmflags 0
zacompatflags 0

sv_randommaprotation 0

// The base pack's maps run gvh00 to gvh48; the addon pack picks up again at GVH50. There is no
// gvh49 in this line, which is the pack's own gap rather than an omission here.
addmap gvh00
addmap gvh01
addmap gvh02
addmap gvh03
addmap gvh04
