// Ghouls vs Humans: Legacy of Darkness. Same game, older line: Team Last Man Standing, one life each
// for the humans to hold a corner with and one for the ghouls to take it.

teamlms true

// Five rounds takes it, ten minutes a round at most.
winlimit 5
timelimit 10

// Read off a running GvH server rather than assembled bit by bit here.
dmflags 4195456
dmflags2 8912912
compatflags 0
compatflags2 6
zadmflags 49103
zacompatflags 0

// After the numbers above, which do not set it either way. Ghouls close distance by jumping, so that
// stays; ducking under a doorway was worth more to a human hiding than to anything chasing them.
sv_nocrouch true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// The base pack's maps run gvh00 to gvh48; the addon pack picks up again at GVH50. There is no
// gvh49 in this line, which is the pack's own gap rather than an omission here.
addmap gvh00
addmap gvh01
addmap gvh02
