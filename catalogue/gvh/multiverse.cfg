// Ghouls vs Humans: Multiverse. Team Last Man Standing, which is how the mod has always been played:
// the humans have one life to hold a corner with, and the ghouls have one to take it.

teamlms true

// Five rounds takes it, ten minutes a round at most.
winlimit 5
timelimit 10

// The mod brings its own classes, weapons and pickups, so the only rules set here are the ones about
// moving. Jumping stays: ghouls close distance with it. Crouching does not.
sv_nojump false
sv_nocrouch true

sv_allowfreelook true

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// The rotation is the numbered maps. GVHEND is a credits stub, titlemap is the title screen, gvhhal
// is seasonal, and the GVHNS set is a series of its own, so none of them belong in a round rotation.
