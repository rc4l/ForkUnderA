// Ghouls vs Humans: Classic Reborn. The decade-old mod brought up to date, and the line the entry
// opens on.

teamlms true

// Five rounds takes it, ten minutes a round at most.
winlimit 5
timelimit 10

// Read off a running GvH server rather than assembled bit by bit here.
dmflags 4195456
dmflags2 8912912
compatflags 0
compatflags2 6
zadmflags 49103
zacompatflags 0

// After the numbers above, which do not set it either way. Ghouls close distance by jumping, so that
// stays; ducking under a doorway was worth more to a human hiding than to anything chasing them.
sv_nocrouch true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// Every map here was checked for the mod's own team starts (thing 5080/5081), and all fifty-one have
// them. Left out: gvhhub, which is a hub, and bourgdm's MAP01-30, whose thirty maps carry none at all
// -- both teams would spawn off the plain deathmatch starts, mixed together.
