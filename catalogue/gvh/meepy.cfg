// Ghouls vs Humans: Meepy Edition. The line that kept being maintained: the 2b9 maps plus every
// later community pack folded into one file, so its rotation is the whole history rather than one
// pack's worth of it.

teamlms true

// [rc4l] Five rounds takes it, ten minutes a round at most, matching the other GvH lines. The
// source server quotes no limits of its own.
winlimit 5
timelimit 10

// Nightmare, as the source server runs it. That already doubles pickup ammo, so sv_doubleammo is
// deliberately absent here where the other GvH lines set it.
skill 4

// Read off a running Meepy Edition server: dmflags 538968705, dmflags2 4, zadmflags 16672,
// compatflags 0, compatflags2 2, zacompatflags 0, then the settings it names one by one.
sv_nohealth true
sv_noarmor true
sv_noweaponspawn true
sv_spawnfarthest true
sv_coop_loseammo true
sv_norunes true
sv_nomedals true
sv_forcevideodefaults true
sv_unblockallies true
compat_floormove true

// Named after the numbers on that server, so these are what it means rather than what the fields
// above happen to add up to. sv_nocrouch and both compat_ settings are not in its flag words at
// all: ducking is off and the two netplay compat bits are on because it says so here.
sv_nocrouch true
compat_noland true
compat_clientssendfullbuttoninfo true
sv_useteamstartsindm true
lms_spectatorchat true
sv_measureoutboundtraffic true

// The mod's own settings, same source. The bot ones matter on a quiet server, which is most of the
// time: superbots fight properly, and the other two stop them twitching and crowding a human.
gvh_dontforcecompat true
gvh_nojitterbotspaz true
gvh_superbots true
gvh_botstayawaymore true
gvh_dontforceteamspawn true
gvh_newplayermessage 5

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// All 118 arenas, in the pack's own mapinfo order, each one read out of the wads rather than
// counted: 66 Hexen format, 52 UDMF, none missing. Left out on purpose: GVHFIN and GVHCRED end the
// human campaign rather than host a round, GVHEND says in the pack's own comment that it is not a
// gameplay map, and titlemap is the title screen. GVH144 is named in the patch's mapinfo with no
// map behind it yet. GVH143 comes from the patch; the GVHPDX maps come from the paradox pack, which
// the patch also carries fixes for, which is why both are loaded.
//
// Thirteen of them carry deathmatch starts and no GvH team start (thing 5080/5081): GVH12, GVH36,
// GVH39, GVH45, GVH61, GVH62, GVH00B, GVH05B, GVH10B, GVH19B, GVH08C, GVH12C and GVH13C. They stay
// in, as GVH12 does in the classic rotation, because sv_useteamstartsindm above is what the source
// server runs and the mod places players itself. If one of them ever drops a round's worth of
// players in one spot, it is these thirteen to look at first.
