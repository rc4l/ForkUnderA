// Ghouls vs Humans: Multiverse. Team Last Man Standing, which is how the mod has always been played:
// the humans have one life to hold a corner with, and the ghouls have one to take it.

teamlms true

// Three rounds takes it, five minutes a round at most.
winlimit 3
timelimit 5

// The mod brings its own classes, weapons and pickups, so the only rules set here are the ones about
// moving. Ghouls close distance by climbing and ducking, and taking either away is taking the team's
// half of the game away.
dmflags 0
dmflags2 0
sv_nojump false
sv_nocrouch false

compatflags 0
compatflags2 0
zadmflags 0
zacompatflags 0

sv_randommaprotation 0

// The rotation is the numbered maps, in order. GVHEND is a credits stub, titlemap is the title
// screen, gvhhal is seasonal, and the GVHNS set is a series of its own, so none of them belong in a
// round rotation.
addmap gvh00
addmap gvh01
addmap gvh02
