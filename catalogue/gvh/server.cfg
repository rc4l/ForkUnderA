// Ghouls vs Humans: Classic. The 2b9 line, and the one the entry opens on.

teamlms true

// Five rounds takes it, ten minutes a round at most.
winlimit 5
timelimit 10

// Read off a running GvH server rather than assembled bit by bit here.
sv_spawnfarthest true
sv_noexit true
sv_nocrouch true
sv_noteamswitch true
sv_noautomapallies true
sv_noautoaim true
compat_floormove true
compat_soundcutoff true
sv_noidentifytarget true
sv_applylmsspectatorsettings true
sv_nocoopinfo true
sv_sharekeys true
sv_keepteams true
sv_forcevideodefaults true
sv_norocketjumping true
sv_awarddamageinsteadkills true
sv_forcealpha true
sv_coop_spactorspawn true
sv_maxbloodscalar true
sv_nodrop true
sv_nounlagged true

// After the numbers above, which do not set it either way. Ghouls close distance by jumping, so that
// stays; ducking under a doorway was worth more to a human hiding than to anything chasing them.

sv_allowfreelook true

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// All thirty-three, in the pack's own order. Thirty-two carry the mod's team starts (thing
// 5080/5081); gvh12 "Urban Decay" carries none but does ship ACS, so it is left in the rotation the
// pack itself chains it into rather than dropped on the strength of a static count.
addmap GVH01
addmap GVH02
addmap GVH03
addmap GVH04
addmap GVH05
addmap GVH06
addmap GVH07
addmap GVH08
addmap GVH09
addmap GVH10
addmap GVH11
addmap GVH12
addmap GVH13
addmap GVH14
addmap GVH15
addmap GVH16
addmap GVH17
addmap GVH18
addmap GVH19
addmap GVH20
addmap GVH21
addmap GVH00
addmap GVH22
addmap GVH23
addmap GVH24
addmap GVH25
addmap GVH26
addmap GVH27
addmap GVH28
addmap GVH29
addmap GVH30
addmap GVH31
addmap GVH32
