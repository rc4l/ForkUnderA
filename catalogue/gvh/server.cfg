// Ghouls vs Humans: Classic. The 2b9 line, and the one the entry opens on.

teamlms true

// Five rounds takes it, ten minutes a round at most.
winlimit 5
timelimit 10

// Read off a running GvH server rather than assembled bit by bit here.
dmflags 4195456
dmflags2 8912912
compatflags 0
compatflags2 6
zadmflags 49103
zacompatflags 0

// After the numbers above, which do not set it either way. Ghouls close distance by jumping, so that
// stays; ducking under a doorway was worth more to a human hiding than to anything chasing them.
sv_nocrouch true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// All thirty-three, in the pack's own order. Thirty-two carry the mod's team starts (thing
// 5080/5081); gvh12 "Urban Decay" carries none but does ship ACS, so it is left in the rotation the
// pack itself chains it into rather than dropped on the strength of a static count.
addmap GVH01
addmap GVH02
addmap GVH03
addmap GVH04
addmap GVH05
addmap GVH06
addmap GVH07
addmap GVH08
addmap GVH09
addmap GVH10
addmap GVH11
addmap GVH12
addmap GVH13
addmap GVH14
addmap GVH15
addmap GVH16
