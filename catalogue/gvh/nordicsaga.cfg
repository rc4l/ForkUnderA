// Ghouls vs Humans: Nordic Saga. Its own build of the mod, not a slice of another one.

teamlms true

// Five rounds takes it, ten minutes a round at most.
winlimit 5
timelimit 10

// Read off a running GvH server rather than assembled bit by bit here.
sv_spawnfarthest true
sv_noexit true
sv_nocrouch true
sv_noteamswitch true
sv_noautomapallies true
sv_noautoaim true
compat_floormove true
compat_soundcutoff true
sv_noidentifytarget true
sv_applylmsspectatorsettings true
sv_nocoopinfo true
sv_sharekeys true
sv_keepteams true
sv_forcevideodefaults true
sv_norocketjumping true
sv_awarddamageinsteadkills true
sv_forcealpha true
sv_coop_spactorspawn true
sv_maxbloodscalar true
sv_nodrop true
sv_nounlagged true

// After the numbers above, which do not set it either way. Ghouls close distance by jumping, so that
// stays; ducking under a doorway was worth more to a human hiding than to anything chasing them.

sv_allowfreelook true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

sv_randommaprotation 1

// Written out rather than left to the pack's own chain, which cannot be followed: GVH36 names GV37
// as its next map and no such map exists, so a server reaching it has nowhere to go.
//
// Every map here was checked for the mod's team starts in the build that actually loads -- the patch
// replaces several of the core's -- and all fifty-two have them. Left out: GVH41 to GVH43, which the
// pack itself labels "(old)" and keeps only as the earlier cut of three maps already in the list.
addmap GVH00
addmap GVH01
addmap GVH02
addmap GVH03
addmap GVH04
addmap GVH05
addmap GVH06
addmap GVH07
addmap GVH08
addmap GVH09
addmap GVH10
addmap GVH11
addmap GVH12
addmap GVH13
addmap GVH14
addmap GVH15
addmap GVH16
