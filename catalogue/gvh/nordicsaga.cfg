// Ghouls vs Humans: Nordic Saga. The GVHNS series, which ships inside the Multiverse map pack and is
// a run of its own rather than part of that rotation.

teamlms true

// Five rounds takes it, ten minutes a round at most.
winlimit 5
timelimit 10

// Read off a running GvH server rather than assembled bit by bit here.
dmflags 4195456
dmflags2 8912912
compatflags 0
compatflags2 6
zadmflags 49103
zacompatflags 0

// After the numbers above, which do not set it either way. Ghouls close distance by jumping, so that
// stays; ducking under a doorway was worth more to a human hiding than to anything chasing them.
sv_nocrouch true

sv_randommaprotation 1

// Eight maps, so the whole series is the rotation.
addmap GVHNS01
addmap GVHNS02
addmap GVHNS03
addmap GVHNS04
addmap GVHNS05
addmap GVHNS06
addmap GVHNS07
addmap GVHNS08
