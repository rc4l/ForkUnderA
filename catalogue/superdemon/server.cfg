// Super Demon: last man standing across the boss arenas, one life a round.

lastmanstanding true

sv_maxlives 1

// Hurt Me Plenty, as the pack is run.
skill 2

sv_weaponstay true
sv_forcerespawn true
sv_itemrespawn true
sv_allowfreelook true

sv_bfgfreeaim true
sv_disallowsuicide true

sv_noidentifytarget true
sv_unblockplayers true
sv_sharekeys true
sv_unblockallies true
sv_nodrop true

// Soulspheres and the like keep their gravity.
compat_nogravity_spheres true

// The rotation is written out, so a vote may move it.
sv_nomapvote false
sv_nochangemapvote false
sv_nonextmapvote false

// [rc4l] No win limit and no time limit, deliberately. The rotation this was read off has neither
// and is meant not to: a boss arena is played until the players are done with it, not until a
// counter says the server should move on.
sv_randommaprotation 1

// [rc4l] BOSS01-BOSS23 come from superdemon-.pk3 and BOSS24-BOSS48 from the supremacy pack, which
// also replaces BOSS09 and BOSS20. BOSS43 exists and is a complete map, and is left out here because
// the rotation this was taken from leaves it out.
