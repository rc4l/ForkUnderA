// DoomWare: the community minigames.
//
// The same rules on MAP02, which is the pack's second set. If you change something above the
// rotation, change it in server.cfg too.

deathmatch 1

skill 0

sv_unblockplayers true
sv_forcerespawn true
sv_forcerespawntime 1
sv_nocrouch true
compat_clientssendfullbuttoninfo true

// MAP02 chains to itself, the same way MAP01 does. There is no boss fight on this side.
addmap MAP02
