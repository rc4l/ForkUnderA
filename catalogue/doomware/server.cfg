// DoomWare: the main minigame set.
//
// [rc4l] Short, and that is not an omission. Most of what the mod documents as required is already
// the engine default -- jumping on, shared keys off, rocket jumping on, degeneration off, monsters
// on, same-spot respawn off, same level off -- which is why a running DoomWare server reports every
// flag field as zero. Only the settings that are NOT the default are below.
//
// If you change something above the rotation, change it in community.cfg too.

deathmatch 1

// The only skill the pack defines. It runs clearskills and declares one block, which its scripts
// read back as three, so the "skill 3" in the mod's own instructions is what a server without the
// wad loaded would need and not what this one wants.
skill 0

// Players walk through each other. The minigames crowd everybody into one arena, and a body that
// blocks is a telefrag waiting for the next round to move somebody into it.
sv_unblockplayers true

// Nobody sits out a round. One second, because a minigame that has already started cannot be
// rejoined and a corpse watching it is a player who has stopped playing.
sv_forcerespawn true
sv_forcerespawntime 1

// The mod's own mapinfo sets NoCrouch on every map; said here as well so it survives a mapinfo the
// server operator layers on top.
sv_nocrouch true

// The minigames read the full button state -- several of them are built on it -- and cannot work
// from the buttons a client sends by default.
compat_clientssendfullbuttoninfo true

// No sv_chasecam, which the mod recommends as optional. Third person is not shipped anywhere in
// this catalogue.

// One map, and the mod moves itself. MAP01 chains to itself in the pack's own mapinfo, and MAP30
// is reached by the boss fight rather than by the rotation, so a second line here would take the
// server somewhere the mod did not send it.
addmap MAP01
