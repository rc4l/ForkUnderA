// Zero Invasion. Skulltag's invasion settings, on this pack's own maps.

invasion true
cooperative true

// Players are not fighting each other here, so the deathmatch flags do not apply.

Compat_SkulltagJumping true
sv_sharekeys true
sv_unblockplayers true
sv_nodrop true
sv_allowfreelook true

// Ultra-Violence.
skill 3

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// No rotation on purpose, unlike Skulltag's. The pack's own mapinfo runs the three tiers into each
// other and loops back to the first, which is an order worth leaving alone: it deliberately routes
// around Z3INV03, whose `next` names a map the pack does not ship.
sv_randommaprotation 0
