// Armageddon Invasion. Skulltag's invasion settings, on this pack's own maps.

invasion true
cooperative true

// Players are not fighting each other here, so the deathmatch flags do not apply.

Compat_SkulltagJumping true
sv_sharekeys true
sv_unblockplayers true
sv_nodrop true
sv_allowfreelook true

// Ultra-Violence.
skill 3

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// No rotation on purpose, unlike Skulltag's. This pack's own mapinfo already chains all ten maps and
// loops back, so a list written here would be a second opinion about an order it gives.
sv_randommaprotation 0
