// Alpha and Delta Invasion. Skulltag's invasion settings, on this pack's own maps.

invasion true
cooperative true

// Players are not fighting each other here, so the deathmatch flags do not apply.

Compat_SkulltagJumping true
sv_sharekeys true
sv_unblockplayers true
sv_nodrop true
sv_allowfreelook true

// Ultra-Violence.
skill 3

// No rotation on purpose, unlike Skulltag's. This pack's own mapinfo already chains all twenty-five
// maps and loops back, so a list written here would be a second opinion about an order it gives.
sv_randommaprotation 0
