// Doom Barracks Zone: X Edition, cooperative. The same nine maps and three more after them.

cooperative true

// The same numbers the original runs on.
sv_weaponstay true
sv_falldamage true
sv_oldfalldamage true
sv_samelevel true
sv_noarmor true
sv_itemrespawn true
compat_limited_airmovement true
sv_sharekeys true
sv_unblockplayers true
sv_nodrop true
sv_allowfreelook true

// Ultra-Violence.
skill 3

// Twice the ammo from every pickup. Nightmare already doubles it on its own, so the
// experiences that run on skill 4 are left alone.
sv_doubleammo true

// No rotation on purpose. The pack's own zmapinfo chains map01 through map12 and then back to the
// start, and it also carries two test maps that a rotation written here would have to know to skip.
sv_randommaprotation 0
