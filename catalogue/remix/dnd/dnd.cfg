// Death and Decay, exec'd after the experience's own cfg so it wins.
//
// [rc4l] These are the mod's own requirements rather than a taste, which is why a mix carries a cfg
// at all. Decoded from the numbers a running DND server reports -- dmflags 3227652, dmflags2 256,
// dmflags3 1104, compatflags2 2 -- and written out by name, because the numbers are the easy thing
// to get wrong and say nothing to whoever reads this next.

// Nobody takes the weapon away, and the loot comes back. DND is built on picking things up
// repeatedly: the classic co-op sets turn item respawn OFF and are balanced on that, so this is a
// real change to how those maps play and is the mod's call, not theirs.
sv_weaponstay true
sv_itemrespawn true

// [rc4l] And NO per-player copy of each weapon. DND hands weapons out through its own loot, so the
// cooperative duplicates would be a second, free supply beside the one the mod is built around.
sv_noweaponspawn true

// The maps are played on foot, and the field of view is the mod's to set: it uses it.
sv_nojump true
sv_nofov true

sv_bfgfreeaim true

// Players walk through each other and share what they find, and damage is what earns credit --
// which is the whole point in a party where one character tanks and another kills.
sv_unblockplayers true
sv_sharekeys true
sv_awarddamageinsteadkills true

compat_floormove true
